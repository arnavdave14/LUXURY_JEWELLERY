<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="24.1%" cy="71.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 89.9178284305241%, 70.95471536732347%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 89.9178284305241%, 70.95471536732347%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 96°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="653.4739722904276" rx="264.2142039500358" ry="53.62066234379906" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="513.3603792866206" rx="293.571337722262" ry="153.20189241085447" fill="none" stroke="url(#goldGradient)" stroke-width="42.701285486874475" />
    <ellipse cx="480" cy="513.3603792866206" rx="293.571337722262" ry="153.20189241085447" fill="none" stroke="#FFFFFF" stroke-width="4.003245514394482" opacity="0.368641461019704" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 426.6233931414069) rotate(14.92)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-88.0714013166786,-112.09087440304549 88.0714013166786,-112.09087440304549 110.08925164584825,0 88.0714013166786,112.09087440304549 -88.0714013166786,112.09087440304549 -110.08925164584825,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-66.05355098750896,-84.06815580228412 66.05355098750896,-84.06815580228412 76.32854780778813,0 66.05355098750896,84.06815580228412 -66.05355098750896,84.06815580228412 -76.32854780778813,0" fill="none" stroke="#FFFFFF" stroke-width="2.4019473086366894" opacity="0.46223587092621155" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-44.0357006583393,-56.045437201522745 44.0357006583393,-56.045437201522745 51.374984101395846,0 44.0357006583393,56.045437201522745 -44.0357006583393,56.045437201522745 -51.374984101395846,0" fill="#FFFFFF" opacity="0.6908813728906051" />
      
      <!-- Corner Step Cuts -->
      <line x1="-88.0714013166786" y1="-112.09087440304549" x2="-44.0357006583393" y2="-56.045437201522745" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="88.0714013166786" y1="-112.09087440304549" x2="44.0357006583393" y2="-56.045437201522745" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="88.0714013166786" y1="112.09087440304549" x2="44.0357006583393" y2="56.045437201522745" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-88.0714013166786" y1="112.09087440304549" x2="-44.0357006583393" y2="56.045437201522745" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-80.73211787362206" cy="-102.7499682027917" r="9.34090620025379" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="80.73211787362206" cy="-102.7499682027917" r="9.34090620025379" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="80.73211787362206" cy="102.7499682027917" r="9.34090620025379" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-80.73211787362206" cy="102.7499682027917" r="9.34090620025379" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="513.3603792866206" rx="281.8284842133715" ry="130.2216085492263" fill="none" stroke="url(#goldGradient)" stroke-width="18.68181240050758" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(414.73725008244446, 415.52577255932204)" opacity="0.818135621484342">
      <ellipse rx="170.44830890038617" ry="4.003245514394482" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.003245514394482" ry="170.44830890038617" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.675321371718619" fill="#C7E84F" opacity="0.9" />
      <circle r="5.337660685859309" fill="#FFFFFF" />
      <circle r="45.45288237343632" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0032 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>