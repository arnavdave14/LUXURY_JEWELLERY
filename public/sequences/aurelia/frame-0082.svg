<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="61.9%" cy="18.9%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 61.296818135360986%, 67.932633569242%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 61.296818135360986%, 67.932633569242%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 246°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="659.0622282248073" rx="272.7255476039373" ry="23.152839970964962" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="514.4350438893861" rx="303.028386226597" ry="66.15097134561418" fill="none" stroke="url(#goldGradient)" stroke-width="44.076856178414104" />
    <ellipse cx="480" cy="514.4350438893861" rx="303.028386226597" ry="66.15097134561418" fill="none" stroke="#FFFFFF" stroke-width="4.132205266726322" opacity="0.27797900707726" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 424.90392977698235) rotate(-13.70)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-90.90851586797909,-115.70174746833702 90.90851586797909,-115.70174746833702 113.63564483497387,0 90.90851586797909,115.70174746833702 -90.90851586797909,115.70174746833702 -113.63564483497387,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-68.18138690098432,-86.77631060125277 68.18138690098432,-86.77631060125277 78.78738041891522,0 68.18138690098432,86.77631060125277 -68.18138690098432,86.77631060125277 -78.78738041891522,0" fill="none" stroke="#FFFFFF" stroke-width="2.4793231600357934" opacity="0.7772542485937372" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-45.454257933989545,-57.85087373416851 45.454257933989545,-57.85087373416851 53.02996758965447,0 45.454257933989545,57.85087373416851 -45.454257933989545,57.85087373416851 -53.02996758965447,0" fill="#FFFFFF" opacity="0.20112115818413412" />
      
      <!-- Corner Step Cuts -->
      <line x1="-90.90851586797909" y1="-115.70174746833702" x2="-45.454257933989545" y2="-57.85087373416851" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="90.90851586797909" y1="-115.70174746833702" x2="45.454257933989545" y2="-57.85087373416851" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="90.90851586797909" y1="115.70174746833702" x2="45.454257933989545" y2="57.85087373416851" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-90.90851586797909" y1="115.70174746833702" x2="-45.454257933989545" y2="57.85087373416851" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-83.33280621231418" cy="-106.05993517930895" r="9.641812289028085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="83.33280621231418" cy="-106.05993517930895" r="9.641812289028085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="83.33280621231418" cy="106.05993517930895" r="9.641812289028085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-83.33280621231418" cy="106.05993517930895" r="9.641812289028085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="514.4350438893861" rx="290.9072507775331" ry="56.22832564377205" fill="none" stroke="url(#goldGradient)" stroke-width="19.28362457805617" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(433.9169164046025, 465.848289267357)" opacity="0.001868596973556857">
      <ellipse rx="60.25226059143017" ry="4.132205266726322" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.132205266726322" ry="60.25226059143017" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.019214044603526" fill="#C7E84F" opacity="0.9" />
      <circle r="5.509607022301763" fill="#FFFFFF" />
      <circle r="16.067269491048048" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0082 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>