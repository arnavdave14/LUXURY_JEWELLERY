<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="19.5%" cy="63.6%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 89.00370639745803%, 68.416320504547%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 89.00370639745803%, 68.416320504547%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 111°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="658.211382034388" rx="271.42964340622166" ry="54.06160198484829" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="514.2714196219977" rx="301.5884926735796" ry="154.4617199567094" fill="none" stroke="url(#goldGradient)" stroke-width="43.86741711615703" />
    <ellipse cx="480" cy="514.2714196219977" rx="301.5884926735796" ry="154.4617199567094" fill="none" stroke="#FFFFFF" stroke-width="4.112570354639722" opacity="0.2924896151364099" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 425.1657286048037) rotate(14.00)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-90.47654780207388,-115.1519699299122 90.47654780207388,-115.1519699299122 113.09568475259235,0 90.47654780207388,115.1519699299122 -90.47654780207388,115.1519699299122 -113.09568475259235,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-67.85741085155541,-86.36397744743415 67.85741085155541,-86.36397744743415 78.41300809513069,0 67.85741085155541,86.36397744743415 -67.85741085155541,86.36397744743415 -78.41300809513069,0" fill="none" stroke="#FFFFFF" stroke-width="2.467542212783833" opacity="0.5865023750651133" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-45.23827390103694,-57.5759849649561 45.23827390103694,-57.5759849649561 52.777986217876425,0 45.23827390103694,57.5759849649561 -45.23827390103694,57.5759849649561 -52.777986217876425,0" fill="#FFFFFF" opacity="0.7492484327696944" />
      
      <!-- Corner Step Cuts -->
      <line x1="-90.47654780207388" y1="-115.1519699299122" x2="-45.23827390103694" y2="-57.5759849649561" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="90.47654780207388" y1="-115.1519699299122" x2="45.23827390103694" y2="-57.5759849649561" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="90.47654780207388" y1="115.1519699299122" x2="45.23827390103694" y2="57.5759849649561" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-90.47654780207388" y1="115.1519699299122" x2="-45.23827390103694" y2="57.5759849649561" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-82.9368354852344" cy="-105.55597243575286" r="9.59599749415935" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="82.9368354852344" cy="-105.55597243575286" r="9.59599749415935" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="82.9368354852344" cy="105.55597243575286" r="9.59599749415935" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-82.9368354852344" cy="105.55597243575286" r="9.59599749415935" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="514.2714196219977" rx="289.5249529666364" ry="131.29246196320298" fill="none" stroke="url(#goldGradient)" stroke-width="19.1919949883187" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(429.06274369229595, 388.4744393368898)" opacity="0.9154140546161575">
      <ellipse rx="183.58089737318127" ry="4.112570354639722" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.112570354639722" ry="183.58089737318127" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.966854279039257" fill="#C7E84F" opacity="0.9" />
      <circle r="5.483427139519629" fill="#FFFFFF" />
      <circle r="48.95490596618168" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0037 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>