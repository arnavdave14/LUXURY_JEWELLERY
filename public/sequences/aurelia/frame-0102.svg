<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="82.9%" cy="44.8%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 62.864745084375784%, 77.87785252292473%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 62.864745084375784%, 77.87785252292473%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 306°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="636.5584442347636" rx="238.45055352679364" ry="21.78515787759813" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="510.1073931220699" rx="264.94505947421516" ry="62.24330822170895" fill="none" stroke="url(#goldGradient)" stroke-width="38.537463196249476" />
    <ellipse cx="480" cy="510.1073931220699" rx="264.94505947421516" ry="62.24330822170895" fill="none" stroke="#FFFFFF" stroke-width="3.6128871746483884" opacity="0.5763355756877419" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 431.82817100468816) rotate(-12.14)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-79.48351784226455,-101.16084089015486 79.48351784226455,-101.16084089015486 99.35439730283068,0 79.48351784226455,101.16084089015486 -79.48351784226455,101.16084089015486 -99.35439730283068,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-59.61263838169841,-75.87063066761615 59.61263838169841,-75.87063066761615 68.88571546329594,0 59.61263838169841,75.87063066761615 -59.61263838169841,75.87063066761615 -68.88571546329594,0" fill="none" stroke="#FFFFFF" stroke-width="2.167732304789033" opacity="0.6227457514062636" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-39.74175892113227,-50.58042044507743 39.74175892113227,-50.58042044507743 46.36538540798765,0 39.74175892113227,50.58042044507743 -39.74175892113227,50.58042044507743 -46.36538540798765,0" fill="#FFFFFF" opacity="0.38299746892526054" />
      
      <!-- Corner Step Cuts -->
      <line x1="-79.48351784226455" y1="-101.16084089015486" x2="-39.74175892113227" y2="-50.58042044507743" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="79.48351784226455" y1="-101.16084089015486" x2="39.74175892113227" y2="-50.58042044507743" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="79.48351784226455" y1="101.16084089015486" x2="39.74175892113227" y2="50.58042044507743" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-79.48351784226455" y1="101.16084089015486" x2="-39.74175892113227" y2="50.58042044507743" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-72.85989135540918" cy="-92.7307708159753" r="8.430070074179573" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="72.85989135540918" cy="-92.7307708159753" r="8.430070074179573" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="72.85989135540918" cy="92.7307708159753" r="8.430070074179573" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-72.85989135540918" cy="92.7307708159753" r="8.430070074179573" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="510.1073931220699" rx="254.34725709524653" ry="52.90681198845261" fill="none" stroke="url(#goldGradient)" stroke-width="16.860140148359147" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(461.39260773790596, 386.014039136841)" opacity="0.3049957815421009">
      <ellipse rx="101.1744305081836" ry="3.6128871746483884" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.6128871746483884" ry="101.1744305081836" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="9.634365799062369" fill="#C7E84F" opacity="0.9" />
      <circle r="4.8171828995311845" fill="#FFFFFF" />
      <circle r="26.97984813551563" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0102 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>