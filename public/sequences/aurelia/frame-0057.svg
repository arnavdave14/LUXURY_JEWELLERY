<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="23.0%" cy="30.4%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 77.34651697560346%, 62.123116594048625%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 77.34651697560346%, 62.123116594048625%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 171°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="668.319664023388" rx="286.82533443562164" ry="43.33716726850795" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="516.2153200044977" rx="318.6948160395796" ry="123.82047791002272" fill="none" stroke="url(#goldGradient)" stroke-width="46.35560960575704" />
    <ellipse cx="480" cy="516.2153200044977" rx="318.6948160395796" ry="123.82047791002272" fill="none" stroke="#FFFFFF" stroke-width="4.345838400539723" opacity="0.10369349782145876" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.0554879928037) rotate(2.35)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-95.60844481187388,-121.68347521511221 95.60844481187388,-121.68347521511221 119.51055601484236,0 95.60844481187388,121.68347521511221 -95.60844481187388,121.68347521511221 -119.51055601484236,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.70633360890541,-91.26260641133416 71.70633360890541,-91.26260641133416 82.8606521702907,0 71.70633360890541,91.26260641133416 -71.70633360890541,91.26260641133416 -82.8606521702907,0" fill="none" stroke="#FFFFFF" stroke-width="2.6075030403238335" opacity="0.8134976249348865" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.80422240593694,-60.841737607556105 47.80422240593694,-60.841737607556105 55.77159280692643,0 47.80422240593694,60.841737607556105 -47.80422240593694,60.841737607556105 -55.77159280692643,0" fill="#FFFFFF" opacity="0.3202803909646682" />
      
      <!-- Corner Step Cuts -->
      <line x1="-95.60844481187388" y1="-121.68347521511221" x2="-47.80422240593694" y2="-60.841737607556105" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.60844481187388" y1="-121.68347521511221" x2="47.80422240593694" y2="-60.841737607556105" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.60844481187388" y1="121.68347521511221" x2="47.80422240593694" y2="60.841737607556105" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-95.60844481187388" y1="121.68347521511221" x2="-47.80422240593694" y2="60.841737607556105" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-87.6410744108844" cy="-111.54318561385287" r="10.140289601259353" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.6410744108844" cy="-111.54318561385287" r="10.140289601259353" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.6410744108844" cy="111.54318561385287" r="10.140289601259353" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-87.6410744108844" cy="111.54318561385287" r="10.140289601259353" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="516.2153200044977" rx="305.9470233979964" ry="105.2474062235193" fill="none" stroke="url(#goldGradient)" stroke-width="20.280579202518705" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(548.8856321599835, 404.1496490518168)" opacity="0.20046731827444705">
      <ellipse rx="87.06308796705035" ry="4.345838400539723" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.345838400539723" ry="87.06308796705035" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.58890240143926" fill="#C7E84F" opacity="0.9" />
      <circle r="5.79445120071963" fill="#FFFFFF" />
      <circle r="23.216823457880096" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0057 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>