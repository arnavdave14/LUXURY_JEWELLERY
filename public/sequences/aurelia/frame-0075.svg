<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="50.0%" cy="16.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 64.39339828220179%, 64.92893218813452%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 64.39339828220179%, 64.92893218813452%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 225°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="664.0469526519103" rx="280.31766634675563" ry="27.377609868166488" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="515.3936447407519" rx="311.4640737186174" ry="78.22174248047568" fill="none" stroke="url(#goldGradient)" stroke-width="45.303865268162525" />
    <ellipse cx="480" cy="515.3936447407519" rx="311.4640737186174" ry="78.22174248047568" fill="none" stroke="#FFFFFF" stroke-width="4.247237368890237" opacity="0.1878679656440357" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 423.37016841479686) rotate(-10.61)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-93.43922211558521,-118.92264632892663 93.43922211558521,-118.92264632892663 116.79902764448153,0 93.43922211558521,118.92264632892663 -93.43922211558521,118.92264632892663 -116.79902764448153,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-70.07941658668891,-89.19198474669498 70.07941658668891,-89.19198474669498 80.98065916684052,0 70.07941658668891,89.19198474669498 -70.07941658668891,89.19198474669498 -80.98065916684052,0" fill="none" stroke="#FFFFFF" stroke-width="2.548342421334142" opacity="0.5232233047033629" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-46.719611057792605,-59.461323164463316 46.719611057792605,-59.461323164463316 54.50621290075804,0 46.719611057792605,59.461323164463316 -46.719611057792605,59.461323164463316 -54.50621290075804,0" fill="#FFFFFF" opacity="0.23749999999999993" />
      
      <!-- Corner Step Cuts -->
      <line x1="-93.43922211558521" y1="-118.92264632892663" x2="-46.719611057792605" y2="-59.461323164463316" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="93.43922211558521" y1="-118.92264632892663" x2="46.719611057792605" y2="-59.461323164463316" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="93.43922211558521" y1="118.92264632892663" x2="46.719611057792605" y2="59.461323164463316" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-93.43922211558521" y1="118.92264632892663" x2="-46.719611057792605" y2="59.461323164463316" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-85.65262027261979" cy="-109.01242580151609" r="9.910220527410551" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="85.65262027261979" cy="-109.01242580151609" r="9.910220527410551" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="85.65262027261979" cy="109.01242580151609" r="9.910220527410551" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-85.65262027261979" cy="109.01242580151609" r="9.910220527410551" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="515.3936447407519" rx="299.00551076987267" ry="66.48848110840433" fill="none" stroke="url(#goldGradient)" stroke-width="19.820441054821103" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(480, 480)" opacity="0.06249999999999989">
      <ellipse rx="68.43749999999999" ry="4.247237368890237" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.247237368890237" ry="68.43749999999999" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.325966317040631" fill="#C7E84F" opacity="0.9" />
      <circle r="5.662983158520316" fill="#FFFFFF" />
      <circle r="18.249999999999996" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0075 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>