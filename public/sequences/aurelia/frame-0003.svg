<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="69.6%" cy="77.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 77.34651697560346%, 81.87688340595138%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 77.34651697560346%, 81.87688340595138%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 9°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="614.5898571000789" rx="204.99070542935098" ry="30.97256561091951" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="505.88266482693825" rx="227.76745047705666" ry="88.49304460262718" fill="none" stroke="url(#goldGradient)" stroke-width="33.12981097848097" />
    <ellipse cx="480" cy="505.88266482693825" rx="227.76745047705666" ry="88.49304460262718" fill="none" stroke="#FFFFFF" stroke-width="3.1059197792325905" opacity="0.6963065021785413" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 438.5877362768988) rotate(2.35)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-68.330235143117,-86.96575381851254 68.330235143117,-86.96575381851254 85.41279392889625,0 68.330235143117,86.96575381851254 -68.330235143117,86.96575381851254 -85.41279392889625,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-51.247676357337745,-65.22431536388441 51.247676357337745,-65.22431536388441 59.21953712403473,0 51.247676357337745,65.22431536388441 -51.247676357337745,65.22431536388441 -59.21953712403473,0" fill="none" stroke="#FFFFFF" stroke-width="1.8635518675395546" opacity="0.8134976249348866" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-34.1651175715585,-43.48287690925627 34.1651175715585,-43.48287690925627 39.859303833484915,0 34.1651175715585,43.48287690925627 -34.1651175715585,43.48287690925627 -39.859303833484915,0" fill="#FFFFFF" opacity="0.7492484327696944" />
      
      <!-- Corner Step Cuts -->
      <line x1="-68.330235143117" y1="-86.96575381851254" x2="-34.1651175715585" y2="-43.48287690925627" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="68.330235143117" y1="-86.96575381851254" x2="34.1651175715585" y2="-43.48287690925627" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="68.330235143117" y1="86.96575381851254" x2="34.1651175715585" y2="43.48287690925627" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-68.330235143117" y1="86.96575381851254" x2="-34.1651175715585" y2="43.48287690925627" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-62.63604888119058" cy="-79.71860766696985" r="7.247146151542712" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="62.63604888119058" cy="-79.71860766696985" r="7.247146151542712" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="62.63604888119058" cy="79.71860766696985" r="7.247146151542712" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-62.63604888119058" cy="79.71860766696985" r="7.247146151542712" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="505.88266482693825" rx="218.6567524579744" ry="75.2190879122331" fill="none" stroke="url(#goldGradient)" stroke-width="14.494292303085423" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(529.231754085486, 451.3848295428742)" opacity="0.9154140546161575">
      <ellipse rx="183.58089737318127" ry="3.1059197792325905" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.1059197792325905" ry="183.58089737318127" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.282452744620242" fill="#C7E84F" opacity="0.9" />
      <circle r="4.141226372310121" fill="#FFFFFF" />
      <circle r="48.95490596618168" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0003 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>