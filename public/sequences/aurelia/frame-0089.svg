<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="72.3%" cy="25.2%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60.02055697868139%, 71.47664043757057%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60.02055697868139%, 71.47664043757057%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 267°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="652.4344007042189" rx="262.63085645719485" ry="20.9133590320703" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="513.1604616738882" rx="291.8120627302165" ry="59.75245437734372" fill="none" stroke="url(#goldGradient)" stroke-width="42.44539094257694" />
    <ellipse cx="480" cy="513.1604616738882" rx="291.8120627302165" ry="59.75245437734372" fill="none" stroke="#FFFFFF" stroke-width="3.979255400866588" opacity="0.384299213127117" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 426.94326132177883) rotate(-14.98)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-87.54361881906495,-111.41915122426448 87.54361881906495,-111.41915122426448 109.4295235238312,0 87.54361881906495,111.41915122426448 -87.54361881906495,111.41915122426448 -109.4295235238312,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-65.65771411429871,-83.56436341819837 65.65771411429871,-83.56436341819837 75.8711363098563,0 65.65771411429871,83.56436341819837 -65.65771411429871,83.56436341819837 -75.8711363098563,0" fill="none" stroke="#FFFFFF" stroke-width="2.387553240519953" opacity="0.9469220851487844" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-43.77180940953247,-55.70957561213224 43.77180940953247,-55.70957561213224 51.067110977787884,0 43.77180940953247,55.70957561213224 -43.77180940953247,55.70957561213224 -51.067110977787884,0" fill="#FFFFFF" opacity="0.4570288237343642" />
      
      <!-- Corner Step Cuts -->
      <line x1="-87.54361881906495" y1="-111.41915122426448" x2="-43.77180940953247" y2="-55.70957561213224" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="87.54361881906495" y1="-111.41915122426448" x2="43.77180940953247" y2="-55.70957561213224" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="87.54361881906495" y1="111.41915122426448" x2="43.77180940953247" y2="55.70957561213224" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-87.54361881906495" y1="111.41915122426448" x2="-43.77180940953247" y2="55.70957561213224" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-80.24831725080955" cy="-102.13422195557578" r="9.284929268688707" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="80.24831725080955" cy="-102.13422195557578" r="9.284929268688707" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="80.24831725080955" cy="102.13422195557578" r="9.284929268688707" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-80.24831725080955" cy="102.13422195557578" r="9.284929268688707" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="513.1604616738882" rx="280.1395802210078" ry="50.78958622074216" fill="none" stroke="url(#goldGradient)" stroke-width="18.569858537377414" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(414.0423896095954, 432.4892006818067)" opacity="0.428381372890607">
      <ellipse rx="117.83148534023195" ry="3.979255400866588" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.979255400866588" ry="117.83148534023195" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.611347735644236" fill="#C7E84F" opacity="0.9" />
      <circle r="5.305673867822118" fill="#FFFFFF" />
      <circle r="31.42172942406185" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0089 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>