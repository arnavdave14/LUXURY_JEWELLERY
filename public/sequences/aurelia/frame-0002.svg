<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="71.0%" cy="75.9%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 76.5679269490148%, 81.94521895368274%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 76.5679269490148%, 81.94521895368274%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 6°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="613.0616534402122" rx="202.6631337012463" ry="29.970063390091788" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="505.58877950773314" rx="225.18125966805144" ry="85.6287525431194" fill="none" stroke="url(#goldGradient)" stroke-width="32.75363776989839" />
    <ellipse cx="480" cy="505.58877950773314" rx="225.18125966805144" ry="85.6287525431194" fill="none" stroke="#FFFFFF" stroke-width="3.070653540927974" opacity="0.698356568610482" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 439.057952787627) rotate(1.57)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-67.55437790041543,-85.97829914598326 67.55437790041543,-85.97829914598326 84.44297237551929,0 67.55437790041543,85.97829914598326 -67.55437790041543,85.97829914598326 -84.44297237551929,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-50.665783425311574,-64.48372435948745 50.665783425311574,-64.48372435948745 58.547127513693376,0 50.665783425311574,64.48372435948745 -50.665783425311574,64.48372435948745 -58.547127513693376,0" fill="none" stroke="#FFFFFF" stroke-width="1.8423921245567845" opacity="0.7772542485937368" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-33.777188950207716,-42.98914957299163 33.777188950207716,-42.98914957299163 39.406720441909,0 33.777188950207716,42.98914957299163 -33.777188950207716,42.98914957299163 -39.406720441909,0" fill="#FFFFFF" opacity="0.6908813728906051" />
      
      <!-- Corner Step Cuts -->
      <line x1="-67.55437790041543" y1="-85.97829914598326" x2="-33.777188950207716" y2="-42.98914957299163" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="67.55437790041543" y1="-85.97829914598326" x2="33.777188950207716" y2="-42.98914957299163" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="67.55437790041543" y1="85.97829914598326" x2="33.777188950207716" y2="42.98914957299163" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-67.55437790041543" y1="85.97829914598326" x2="-33.777188950207716" y2="42.98914957299163" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-61.92484640871415" cy="-78.813440883818" r="7.164858262165273" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="61.92484640871415" cy="-78.813440883818" r="7.164858262165273" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="61.92484640871415" cy="78.813440883818" r="7.164858262165273" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-61.92484640871415" cy="78.813440883818" r="7.164858262165273" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="505.58877950773314" rx="216.17400928132938" ry="72.78443966165149" fill="none" stroke="url(#goldGradient)" stroke-width="14.329716524330546" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(530.0592065623911, 447.57028304909204)" opacity="0.818135621484342">
      <ellipse rx="170.44830890038617" ry="3.070653540927974" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.070653540927974" ry="170.44830890038617" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.188409442474597" fill="#C7E84F" opacity="0.9" />
      <circle r="4.094204721237299" fill="#FFFFFF" />
      <circle r="45.45288237343632" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0002 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>