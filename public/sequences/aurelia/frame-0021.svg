<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="39.7%" cy="81.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 88.36509786282552%, 76.53990499739547%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 88.36509786282552%, 76.53990499739547%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 63°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="640.566166035883" rx="244.55462211619104" ry="48.064654172329305" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="510.8781088530544" rx="271.7273579068789" ry="137.3275833495123" fill="none" stroke="url(#goldGradient)" stroke-width="39.523979331909665" />
    <ellipse cx="480" cy="510.8781088530544" rx="271.7273579068789" ry="137.3275833495123" fill="none" stroke="#FFFFFF" stroke-width="3.7053730623665313" opacity="0.5361971499218641" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 430.5950258351129) rotate(13.37)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-81.51820737206367,-103.75044574626287 81.51820737206367,-103.75044574626287 101.89775921507959,0 81.51820737206367,103.75044574626287 -81.51820737206367,103.75044574626287 -101.89775921507959,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-61.13865552904776,-77.81283430969715 61.13865552904776,-77.81283430969715 70.64911305578852,0 61.13865552904776,77.81283430969715 -61.13865552904776,77.81283430969715 -70.64911305578852,0" fill="none" stroke="#FFFFFF" stroke-width="2.2232238374199187" opacity="0.6608913837399423" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-40.759103686031835,-51.875222873131435 40.759103686031835,-51.875222873131435 47.552287633703806,0 40.759103686031835,51.875222873131435 -40.759103686031835,51.875222873131435 -47.552287633703806,0" fill="#FFFFFF" opacity="0.20007162910305337" />
      
      <!-- Corner Step Cuts -->
      <line x1="-81.51820737206367" y1="-103.75044574626287" x2="-40.759103686031835" y2="-51.875222873131435" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="81.51820737206367" y1="-103.75044574626287" x2="40.759103686031835" y2="-51.875222873131435" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="81.51820737206367" y1="103.75044574626287" x2="40.759103686031835" y2="51.875222873131435" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-81.51820737206367" y1="103.75044574626287" x2="-40.759103686031835" y2="51.875222873131435" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-74.72502342439171" cy="-95.10457526740764" r="8.645870478855239" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="74.72502342439171" cy="-95.10457526740764" r="8.645870478855239" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="74.72502342439171" cy="95.10457526740764" r="8.645870478855239" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-74.72502342439171" cy="95.10457526740764" r="8.645870478855239" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="510.8781088530544" rx="260.85826359060377" ry="116.72844584708545" fill="none" stroke="url(#goldGradient)" stroke-width="17.291740957710477" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(443.70060599498595, 470.5644895411618)" opacity="0.00011938183842229107">
      <ellipse rx="60.016116548187014" ry="3.7053730623665313" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.7053730623665313" ry="60.016116548187014" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="9.880994832977416" fill="#C7E84F" opacity="0.9" />
      <circle r="4.940497416488708" fill="#FFFFFF" />
      <circle r="16.004297746183205" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0021 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>