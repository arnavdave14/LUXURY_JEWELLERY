<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="74.8%" cy="27.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60.02055697868139%, 72.52335956242943%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60.02055697868139%, 72.52335956242943%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 273°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="650.2687426780847" rx="259.3323926943135" ry="20.650701559685086" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="512.7439889765548" rx="288.1471029936817" ry="59.00200445624311" fill="none" stroke="url(#goldGradient)" stroke-width="41.912305889990066" />
    <ellipse cx="480" cy="512.7439889765548" rx="288.1471029936817" ry="59.00200445624311" fill="none" stroke="#FFFFFF" stroke-width="3.9292786771865686" opacity="0.4157007868728829" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 427.60961763751243) rotate(-14.98)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-86.4441308981045,-110.01980296122392 86.4441308981045,-110.01980296122392 108.05516362263063,0 86.4441308981045,110.01980296122392 -86.4441308981045,110.01980296122392 -108.05516362263063,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-64.83309817357838,-82.51485222091794 64.83309817357838,-82.51485222091794 74.91824677835724,0 64.83309817357838,82.51485222091794 -64.83309817357838,82.51485222091794 -74.91824677835724,0" fill="none" stroke="#FFFFFF" stroke-width="2.3575672063119413" opacity="0.9469220851487845" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-43.22206544905225,-55.00990148061196 43.22206544905225,-55.00990148061196 50.42574302389429,0 43.22206544905225,55.00990148061196 -43.22206544905225,55.00990148061196 -50.42574302389429,0" fill="#FFFFFF" opacity="0.6178995471625828" />
      
      <!-- Corner Step Cuts -->
      <line x1="-86.4441308981045" y1="-110.01980296122392" x2="-43.22206544905225" y2="-55.00990148061196" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="86.4441308981045" y1="-110.01980296122392" x2="43.22206544905225" y2="-55.00990148061196" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="86.4441308981045" y1="110.01980296122392" x2="43.22206544905225" y2="55.00990148061196" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-86.4441308981045" y1="110.01980296122392" x2="-43.22206544905225" y2="55.00990148061196" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-79.24045332326247" cy="-100.8514860477886" r="9.168316913435326" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="79.24045332326247" cy="-100.8514860477886" r="9.168316913435326" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="79.24045332326247" cy="100.8514860477886" r="9.168316913435326" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-79.24045332326247" cy="100.8514860477886" r="9.168316913435326" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="512.7439889765548" rx="276.6212188739344" ry="50.15170378780664" fill="none" stroke="url(#goldGradient)" stroke-width="18.336633826870653" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(414.87077204223783, 422.1333314791569)" opacity="0.6964992452709713">
      <ellipse rx="154.02739811158114" ry="3.9292786771865686" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.9292786771865686" ry="154.02739811158114" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.478076472497516" fill="#C7E84F" opacity="0.9" />
      <circle r="5.239038236248758" fill="#FFFFFF" />
      <circle r="41.07397282975497" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0091 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>