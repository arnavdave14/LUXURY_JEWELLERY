<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="17.8%" cy="58.6%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 87.99038105676658%, 67%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 87.99038105676658%, 67%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 120°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="660.6624861213896" rx="275.16286347719347" ry="53.655106284043306" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="514.742785792575" rx="305.7365149746594" ry="153.30030366869516" fill="none" stroke="url(#goldGradient)" stroke-width="44.47076581449592" />
    <ellipse cx="480" cy="514.742785792575" rx="305.7365149746594" ry="153.30030366869516" fill="none" stroke="#FFFFFF" stroke-width="4.169134295108993" opacity="0.2500000000000001" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 424.4115427318801) rotate(12.99)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-91.72095449239782,-116.73576026305177 91.72095449239782,-116.73576026305177 114.65119311549728,0 91.72095449239782,116.73576026305177 -91.72095449239782,116.73576026305177 -114.65119311549728,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-68.79071586929837,-87.55182019728883 68.79071586929837,-87.55182019728883 79.49149389341146,0 68.79071586929837,87.55182019728883 -68.79071586929837,87.55182019728883 -79.49149389341146,0" fill="none" stroke="#FFFFFF" stroke-width="2.5014805770653954" opacity="0.6999999999999998" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-45.86047724619891,-58.36788013152589 45.86047724619891,-58.36788013152589 53.503890120565394,0 45.86047724619891,58.36788013152589 -45.86047724619891,58.36788013152589 -53.503890120565394,0" fill="#FFFFFF" opacity="0.5375000000000005" />
      
      <!-- Corner Step Cuts -->
      <line x1="-91.72095449239782" y1="-116.73576026305177" x2="-45.86047724619891" y2="-58.36788013152589" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="91.72095449239782" y1="-116.73576026305177" x2="45.86047724619891" y2="-58.36788013152589" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="91.72095449239782" y1="116.73576026305177" x2="45.86047724619891" y2="58.36788013152589" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-91.72095449239782" y1="116.73576026305177" x2="-45.86047724619891" y2="58.36788013152589" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-84.07754161803135" cy="-107.0077802411308" r="9.727980021920983" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="84.07754161803135" cy="-107.0077802411308" r="9.727980021920983" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="84.07754161803135" cy="107.0077802411308" r="9.727980021920983" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-84.07754161803135" cy="107.0077802411308" r="9.727980021920983" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="514.742785792575" rx="293.507054375673" ry="130.3052581183909" fill="none" stroke="url(#goldGradient)" stroke-width="19.455960043841966" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(445.257214207425, 376.2705265805026)" opacity="0.562500000000001">
      <ellipse rx="135.9375000000001" ry="4.169134295108993" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.169134295108993" ry="135.9375000000001" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.11769145362398" fill="#C7E84F" opacity="0.9" />
      <circle r="5.55884572681199" fill="#FFFFFF" />
      <circle r="36.250000000000036" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0040 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>