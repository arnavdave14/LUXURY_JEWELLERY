<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="83.2%" cy="46.5%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 63.34281057814543%, 78.29320391049836%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 63.34281057814543%, 78.29320391049836%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 309°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="635.1848991632853" rx="236.35853872561913" ry="22.060084886075156" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="509.84324983909335" rx="262.62059858402125" ry="63.028813960214734" fill="none" stroke="url(#goldGradient)" stroke-width="38.19935979403945" />
    <ellipse cx="480" cy="509.84324983909335" rx="262.62059858402125" ry="63.028813960214734" fill="none" stroke="#FFFFFF" stroke-width="3.5811899806911986" opacity="0.5887961173149511" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 432.2508002574507) rotate(-11.66)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-78.78617957520638,-100.27331945935356 78.78617957520638,-100.27331945935356 98.48272446900796,0 78.78617957520638,100.27331945935356 -78.78617957520638,100.27331945935356 -98.48272446900796,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-59.08963468140478,-75.20498959451517 59.08963468140478,-75.20498959451517 68.28135563184553,0 59.08963468140478,75.20498959451517 -59.08963468140478,75.20498959451517 -68.28135563184553,0" fill="none" stroke="#FFFFFF" stroke-width="2.1487139884147193" opacity="0.5865023750651136" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-39.39308978760319,-50.13665972967678 39.39308978760319,-50.13665972967678 45.95860475220372,0 39.39308978760319,50.13665972967678 -39.39308978760319,50.13665972967678 -45.95860475220372,0" fill="#FFFFFF" opacity="0.3202803909646691" />
      
      <!-- Corner Step Cuts -->
      <line x1="-78.78617957520638" y1="-100.27331945935356" x2="-39.39308978760319" y2="-50.13665972967678" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="78.78617957520638" y1="-100.27331945935356" x2="39.39308978760319" y2="-50.13665972967678" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="78.78617957520638" y1="100.27331945935356" x2="39.39308978760319" y2="50.13665972967678" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-78.78617957520638" y1="100.27331945935356" x2="-39.39308978760319" y2="50.13665972967678" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-72.22066461060585" cy="-91.91720950440744" r="8.356109954946131" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="72.22066461060585" cy="-91.91720950440744" r="8.356109954946131" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="72.22066461060585" cy="91.91720950440744" r="8.356109954946131" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-72.22066461060585" cy="91.91720950440744" r="8.356109954946131" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="509.84324983909335" rx="252.1157746406604" ry="53.57449186618252" fill="none" stroke="url(#goldGradient)" stroke-width="16.712219909892262" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(467.5904789329145, 385.5450350923168)" opacity="0.20046731827444852">
      <ellipse rx="87.06308796705055" ry="3.5811899806911986" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.5811899806911986" ry="87.06308796705055" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="9.549839948509863" fill="#C7E84F" opacity="0.9" />
      <circle r="4.7749199742549315" fill="#FFFFFF" />
      <circle r="23.21682345788015" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0103 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>