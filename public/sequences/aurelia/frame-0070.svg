<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="41.4%" cy="17.8%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 67.5%, 63.33974596215562%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 67.5%, 63.33974596215562%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 210°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="666.5066608379104" rx="284.063991122356" ry="31.383332352533014" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="515.866665545752" rx="315.6266568026178" ry="89.66666386438004" fill="none" stroke="url(#goldGradient)" stroke-width="45.909331898562584" />
    <ellipse cx="480" cy="515.866665545752" rx="315.6266568026178" ry="89.66666386438004" fill="none" stroke="#FFFFFF" stroke-width="4.303999865490242" opacity="0.14019237886466845" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.61333512679676) rotate(-7.50)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-94.68799704078533,-120.51199623372678 94.68799704078533,-120.51199623372678 118.35999630098166,0 94.68799704078533,120.51199623372678 -94.68799704078533,120.51199623372678 -118.35999630098166,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.015997780589,-90.3839971752951 71.015997780589,-90.3839971752951 82.06293076868063,0 71.015997780589,90.3839971752951 -71.015997780589,90.3839971752951 -82.06293076868063,0" fill="none" stroke="#FFFFFF" stroke-width="2.5823999192941454" opacity="0.44999999999999996" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.34399852039267,-60.25599811686339 47.34399852039267,-60.25599811686339 55.23466494045811,0 47.34399852039267,60.25599811686339 -47.34399852039267,60.25599811686339 -55.23466494045811,0" fill="#FFFFFF" opacity="0.5374999999999994" />
      
      <!-- Corner Step Cuts -->
      <line x1="-94.68799704078533" y1="-120.51199623372678" x2="-47.34399852039267" y2="-60.25599811686339" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="94.68799704078533" y1="-120.51199623372678" x2="47.34399852039267" y2="-60.25599811686339" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="94.68799704078533" y1="120.51199623372678" x2="47.34399852039267" y2="60.25599811686339" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-94.68799704078533" y1="120.51199623372678" x2="-47.34399852039267" y2="60.25599811686339" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-86.7973306207199" cy="-110.46932988091622" r="10.042666352810565" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="86.7973306207199" cy="-110.46932988091622" r="10.042666352810565" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="86.7973306207199" cy="110.46932988091622" r="10.042666352810565" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-86.7973306207199" cy="110.46932988091622" r="10.042666352810565" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="515.866665545752" rx="303.00159053051306" ry="76.21666428472304" fill="none" stroke="url(#goldGradient)" stroke-width="20.08533270562113" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(515.866665545752, 472.3116447454548)" opacity="0.562499999999999">
      <ellipse rx="135.9374999999999" ry="4.303999865490242" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.303999865490242" ry="135.9374999999999" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.477332974640646" fill="#C7E84F" opacity="0.9" />
      <circle r="5.738666487320323" fill="#FFFFFF" />
      <circle r="36.249999999999964" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0070 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>