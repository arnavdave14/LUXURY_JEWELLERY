<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="39.7%" cy="18.3%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 68.1901425039068%, 63.08993475811632%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 68.1901425039068%, 63.08993475811632%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 207°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="666.8836403432641" rx="284.638159907433" ry="32.257002407863375" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="515.9391616044738" rx="316.26462211937" ry="92.16286402246679" fill="none" stroke="url(#goldGradient)" stroke-width="46.002126853726544" />
    <ellipse cx="480" cy="515.9391616044738" rx="316.26462211937" ry="92.16286402246679" fill="none" stroke="#FFFFFF" stroke-width="4.312699392536864" opacity="0.13269804274348962" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.49734143284184) rotate(-6.81)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-94.879386635811,-120.75558299103217 94.879386635811,-120.75558299103217 118.59923329476376,0 94.879386635811,120.75558299103217 -94.879386635811,120.75558299103217 -118.59923329476376,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.15953997685826,-90.56668724327413 71.15953997685826,-90.56668724327413 82.2288017510362,0 71.15953997685826,90.56668724327413 -71.15953997685826,90.56668724327413 -82.2288017510362,0" fill="none" stroke="#FFFFFF" stroke-width="2.587619635522118" opacity="0.45307791485121557" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.4396933179055,-60.377791495516085 47.4396933179055,-60.377791495516085 55.34630887088975,0 47.4396933179055,60.377791495516085 -47.4396933179055,60.377791495516085 -55.34630887088975,0" fill="#FFFFFF" opacity="0.6178995471625847" />
      
      <!-- Corner Step Cuts -->
      <line x1="-94.879386635811" y1="-120.75558299103217" x2="-47.4396933179055" y2="-60.377791495516085" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="94.879386635811" y1="-120.75558299103217" x2="47.4396933179055" y2="-60.377791495516085" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="94.879386635811" y1="120.75558299103217" x2="47.4396933179055" y2="60.377791495516085" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-94.879386635811" y1="120.75558299103217" x2="-47.4396933179055" y2="60.377791495516085" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-86.97277108282677" cy="-110.6926177417795" r="10.06296524925268" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="86.97277108282677" cy="-110.6926177417795" r="10.06296524925268" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="86.97277108282677" cy="110.6926177417795" r="10.06296524925268" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-86.97277108282677" cy="110.6926177417795" r="10.06296524925268" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="515.9391616044738" rx="303.61403723459523" ry="78.33843441909677" fill="none" stroke="url(#goldGradient)" stroke-width="20.12593049850536" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(522.2490183417314, 469.0179694354129)" opacity="0.6964992452709744">
      <ellipse rx="154.02739811158153" ry="4.312699392536864" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.312699392536864" ry="154.02739811158153" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.500531713431636" fill="#C7E84F" opacity="0.9" />
      <circle r="5.750265856715818" fill="#FFFFFF" />
      <circle r="41.07397282975508" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0069 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>