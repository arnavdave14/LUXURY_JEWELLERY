<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="79.7%" cy="65.1%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 70.36474508437578%, 81.51056516295154%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 70.36474508437578%, 81.51056516295154%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 342°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="619.1514162048535" rx="211.9383108350846" ry="25.91913682194264" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="506.7598877317026" rx="235.48701203898287" ry="74.05467663412183" fill="none" stroke="url(#goldGradient)" stroke-width="34.252656296579325" />
    <ellipse cx="480" cy="506.7598877317026" rx="235.48701203898287" ry="74.05467663412183" fill="none" stroke="#FFFFFF" stroke-width="3.211186527804312" opacity="0.685316954888546" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 437.18417962927583) rotate(-4.64)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-70.64610361169485,-89.91322277852072 70.64610361169485,-89.91322277852072 88.30762951461858,0 70.64610361169485,89.91322277852072 -70.64610361169485,89.91322277852072 -88.30762951461858,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-52.98457770877115,-67.43491708389054 52.98457770877115,-67.43491708389054 61.22662313013555,0 52.98457770877115,67.43491708389054 -52.98457770877115,67.43491708389054 -61.22662313013555,0" fill="none" stroke="#FFFFFF" stroke-width="1.926711916682587" opacity="0.49774575140626326" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-35.32305180584743,-44.95661138926036 35.32305180584743,-44.95661138926036 41.210227106821996,0 35.32305180584743,44.95661138926036 -35.32305180584743,44.95661138926036 -41.210227106821996,0" fill="#FFFFFF" opacity="0.21642118334726854" />
      
      <!-- Corner Step Cuts -->
      <line x1="-70.64610361169485" y1="-89.91322277852072" x2="-35.32305180584743" y2="-44.95661138926036" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="70.64610361169485" y1="-89.91322277852072" x2="35.32305180584743" y2="-44.95661138926036" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="70.64610361169485" y1="89.91322277852072" x2="35.32305180584743" y2="44.95661138926036" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-70.64610361169485" y1="89.91322277852072" x2="-35.32305180584743" y2="44.95661138926036" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-64.7589283107203" cy="-82.42045421364399" r="7.4927685648767275" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="64.7589283107203" cy="-82.42045421364399" r="7.4927685648767275" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="64.7589283107203" cy="82.42045421364399" r="7.4927685648767275" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-64.7589283107203" cy="82.42045421364399" r="7.4927685648767275" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="506.7598877317026" rx="226.06753155742354" ry="62.94647513900355" fill="none" stroke="url(#goldGradient)" stroke-width="14.985537129753455" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(523.2984078850261, 412.01767185056053)" opacity="0.027368638912114225">
      <ellipse rx="63.69476625313543" ry="3.211186527804312" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.211186527804312" ry="63.69476625313543" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.563164074144831" fill="#C7E84F" opacity="0.9" />
      <circle r="4.281582037072416" fill="#FFFFFF" />
      <circle r="16.985271000836114" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0114 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>