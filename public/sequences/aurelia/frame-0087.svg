<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="69.6%" cy="23.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60.18467489107294%, 70.4356553495977%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60.18467489107294%, 70.4356553495977%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 261°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="654.4837489876018" rx="265.75217153496277" ry="21.341802358058917" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="513.5545671130003" rx="295.28019059440305" ry="60.97657816588262" fill="none" stroke="url(#goldGradient)" stroke-width="42.94984590464045" />
    <ellipse cx="480" cy="513.5545671130003" rx="295.28019059440305" ry="60.97657816588262" fill="none" stroke="#FFFFFF" stroke-width="4.026548053560042" opacity="0.3530696604879307" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 426.3126926191994) rotate(-14.82)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-88.58405717832092,-112.74334549968117 88.58405717832092,-112.74334549968117 110.73007147290114,0 88.58405717832092,112.74334549968117 -88.58405717832092,112.74334549968117 -110.73007147290114,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-66.43804288374069,-84.55750912476088 66.43804288374069,-84.55750912476088 76.77284955454479,0 66.43804288374069,84.55750912476088 -66.43804288374069,84.55750912476088 -76.77284955454479,0" fill="none" stroke="#FFFFFF" stroke-width="2.415928832136025" opacity="0.9227516310470918" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-44.29202858916046,-56.371672749840585 44.29202858916046,-56.371672749840585 51.67403335402053,0 44.29202858916046,56.371672749840585 -44.29202858916046,56.371672749840585 -51.67403335402053,0" fill="#FFFFFF" opacity="0.32028039096466865" />
      
      <!-- Corner Step Cuts -->
      <line x1="-88.58405717832092" y1="-112.74334549968117" x2="-44.29202858916046" y2="-56.371672749840585" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="88.58405717832092" y1="-112.74334549968117" x2="44.29202858916046" y2="-56.371672749840585" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="88.58405717832092" y1="112.74334549968117" x2="44.29202858916046" y2="56.371672749840585" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-88.58405717832092" y1="112.74334549968117" x2="-44.29202858916046" y2="56.371672749840585" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-81.20205241346085" cy="-103.34806670804109" r="9.395278791640099" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="81.20205241346085" cy="-103.34806670804109" r="9.395278791640099" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="81.20205241346085" cy="103.34806670804109" r="9.395278791640099" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-81.20205241346085" cy="103.34806670804109" r="9.395278791640099" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="513.5545671130003" rx="283.46898297062694" ry="51.83009144100023" fill="none" stroke="url(#goldGradient)" stroke-width="18.790557583280197" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(416.1754205914359, 442.90298298209837)" opacity="0.20046731827444772">
      <ellipse rx="87.06308796705044" ry="4.026548053560042" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.026548053560042" ry="87.06308796705044" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.737461476160112" fill="#C7E84F" opacity="0.9" />
      <circle r="5.368730738080056" fill="#FFFFFF" />
      <circle r="23.216823457880118" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0087 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>