<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="29.0%" cy="24.1%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 73.4320730509852%, 62.05478104631727%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 73.4320730509852%, 62.05478104631727%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 186°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="668.4198277831426" rx="286.9778915466326" ry="38.726834989217124" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="516.2345822659889" rx="318.86432394070283" ry="110.64809996919179" fill="none" stroke="url(#goldGradient)" stroke-width="46.380265300465865" />
    <ellipse cx="480" cy="516.2345822659889" rx="318.86432394070283" ry="110.64809996919179" fill="none" stroke="#FFFFFF" stroke-width="4.348149871918675" opacity="0.10164343138951804" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.0246683744177) rotate(-1.57)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-95.65929718221085,-121.74819641372288 95.65929718221085,-121.74819641372288 119.57412147776355,0 95.65929718221085,121.74819641372288 -95.65929718221085,121.74819641372288 -119.57412147776355,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.74447288665814,-91.31114731029217 71.74447288665814,-91.31114731029217 82.90472422458274,0 71.74447288665814,91.31114731029217 -71.74447288665814,91.31114731029217 -82.90472422458274,0" fill="none" stroke="#FFFFFF" stroke-width="2.608889923151205" opacity="0.6227457514062632" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.829648591105425,-60.87409820686144 47.829648591105425,-60.87409820686144 55.801256689622996,0 47.829648591105425,60.87409820686144 -47.829648591105425,60.87409820686144 -55.801256689622996,0" fill="#FFFFFF" opacity="0.6908813728906051" />
      
      <!-- Corner Step Cuts -->
      <line x1="-95.65929718221085" y1="-121.74819641372288" x2="-47.829648591105425" y2="-60.87409820686144" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.65929718221085" y1="-121.74819641372288" x2="47.829648591105425" y2="-60.87409820686144" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.65929718221085" y1="121.74819641372288" x2="47.829648591105425" y2="60.87409820686144" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-95.65929718221085" y1="121.74819641372288" x2="-47.829648591105425" y2="60.87409820686144" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-87.68768908369329" cy="-111.60251337924599" r="10.145683034476908" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.68768908369329" cy="-111.60251337924599" r="10.145683034476908" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.68768908369329" cy="111.60251337924599" r="10.145683034476908" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-87.68768908369329" cy="111.60251337924599" r="10.145683034476908" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="516.2345822659889" rx="306.1097509830747" ry="94.05088497381301" fill="none" stroke="url(#goldGradient)" stroke-width="20.291366068953817" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(550.8855394141376, 434.0784175984128)" opacity="0.818135621484342">
      <ellipse rx="170.44830890038617" ry="4.348149871918675" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.348149871918675" ry="170.44830890038617" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.595066325116466" fill="#C7E84F" opacity="0.9" />
      <circle r="5.797533162558233" fill="#FFFFFF" />
      <circle r="45.45288237343632" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0062 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>