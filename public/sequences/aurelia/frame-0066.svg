<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="34.9%" cy="20.3%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 70.36474508437578%, 62.489434837048464%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 70.36474508437578%, 62.489434837048464%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 198°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="667.7797679248156" rx="286.0030311470267" ry="34.97693110123136" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="516.1114938316953" rx="317.7811457189186" ry="99.93408886066102" fill="none" stroke="url(#goldGradient)" stroke-width="46.22271210456998" />
    <ellipse cx="480" cy="516.1114938316953" rx="317.7811457189186" ry="99.93408886066102" fill="none" stroke="#FFFFFF" stroke-width="4.3333792598034355" opacity="0.114683045111454" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.22160986928753) rotate(-4.64)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-95.33434371567557,-121.33461927449619 95.33434371567557,-121.33461927449619 119.16792964459447,0 95.33434371567557,121.33461927449619 -95.33434371567557,121.33461927449619 -119.16792964459447,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.50075778675668,-91.00096445587215 71.50075778675668,-91.00096445587215 82.62309788691884,0 71.50075778675668,91.00096445587215 -71.50075778675668,91.00096445587215 -82.62309788691884,0" fill="none" stroke="#FFFFFF" stroke-width="2.6000275558820616" opacity="0.49774575140626287" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.667171857837786,-60.667309637248096 47.667171857837786,-60.667309637248096 55.61170050081075,0 47.667171857837786,60.667309637248096 -47.667171857837786,60.667309637248096 -55.61170050081075,0" fill="#FFFFFF" opacity="0.7869601895433367" />
      
      <!-- Corner Step Cuts -->
      <line x1="-95.33434371567557" y1="-121.33461927449619" x2="-47.667171857837786" y2="-60.667309637248096" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.33434371567557" y1="-121.33461927449619" x2="47.667171857837786" y2="-60.667309637248096" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.33434371567557" y1="121.33461927449619" x2="47.667171857837786" y2="60.667309637248096" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-95.33434371567557" y1="121.33461927449619" x2="-47.667171857837786" y2="60.667309637248096" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-87.38981507270262" cy="-111.22340100162153" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.38981507270262" cy="-111.22340100162153" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.38981507270262" cy="111.22340100162153" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-87.38981507270262" cy="111.22340100162153" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="516.1114938316953" rx="305.0698998901618" ry="84.94397553156186" fill="none" stroke="url(#goldGradient)" stroke-width="20.222436545749368" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(538.4296244042151, 456.1828954893213)" opacity="0.9782669825722278">
      <ellipse rx="192.06604264725075" ry="4.3333792598034355" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.3333792598034355" ry="192.06604264725075" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.555678026142495" fill="#C7E84F" opacity="0.9" />
      <circle r="5.777839013071247" fill="#FFFFFF" />
      <circle r="51.2176113726002" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0066 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>