<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="75.9%" cy="71.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 73.43207305098518%, 81.94521895368274%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 73.43207305098518%, 81.94521895368274%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 354°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="613.0616534402122" rx="202.66313370124632" ry="27.348802707230384" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="505.58877950773314" rx="225.18125966805147" ry="78.13943630637253" fill="none" stroke="url(#goldGradient)" stroke-width="32.7536377698984" />
    <ellipse cx="480" cy="505.58877950773314" rx="225.18125966805147" ry="78.13943630637253" fill="none" stroke="#FFFFFF" stroke-width="3.0706535409279745" opacity="0.698356568610482" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 439.057952787627) rotate(-1.57)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-67.55437790041543,-85.9782991459833 67.55437790041543,-85.9782991459833 84.4429723755193,0 67.55437790041543,85.9782991459833 -67.55437790041543,85.9782991459833 -84.4429723755193,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-50.66578342531158,-64.48372435948748 50.66578342531158,-64.48372435948748 58.54712751369338,0 50.66578342531158,64.48372435948748 -50.66578342531158,64.48372435948748 -58.54712751369338,0" fill="none" stroke="#FFFFFF" stroke-width="1.842392124556785" opacity="0.6227457514062625" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-33.777188950207716,-42.98914957299165 33.777188950207716,-42.98914957299165 39.406720441909,0 33.777188950207716,42.98914957299165 -33.777188950207716,42.98914957299165 -39.406720441909,0" fill="#FFFFFF" opacity="0.3829974689252599" />
      
      <!-- Corner Step Cuts -->
      <line x1="-67.55437790041543" y1="-85.9782991459833" x2="-33.777188950207716" y2="-42.98914957299165" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="67.55437790041543" y1="-85.9782991459833" x2="33.777188950207716" y2="-42.98914957299165" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="67.55437790041543" y1="85.9782991459833" x2="33.777188950207716" y2="42.98914957299165" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-67.55437790041543" y1="85.9782991459833" x2="-33.777188950207716" y2="42.98914957299165" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-61.92484640871416" cy="-78.81344088381803" r="7.164858262165274" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="61.92484640871416" cy="-78.81344088381803" r="7.164858262165274" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="61.92484640871416" cy="78.81344088381803" r="7.164858262165274" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-61.92484640871416" cy="78.81344088381803" r="7.164858262165274" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="505.58877950773314" rx="216.1740092813294" ry="66.41852086041665" fill="none" stroke="url(#goldGradient)" stroke-width="14.329716524330548" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(530.0592065623911, 430.54562252616194)" opacity="0.3049957815420998">
      <ellipse rx="101.17443050818346" ry="3.0706535409279745" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.0706535409279745" ry="101.17443050818346" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.1884094424746" fill="#C7E84F" opacity="0.9" />
      <circle r="4.0942047212373" fill="#FFFFFF" />
      <circle r="26.979848135515592" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0118 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>