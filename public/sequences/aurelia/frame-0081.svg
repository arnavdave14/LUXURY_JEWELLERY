<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="60.3%" cy="18.3%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 61.634902137174485%, 67.46009500260453%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 61.634902137174485%, 67.46009500260453%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 243°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="659.8794496147144" rx="273.97023864394964" ry="23.640546079453788" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="514.5922018489836" rx="304.41137627105513" ry="67.54441736986797" fill="none" stroke="url(#goldGradient)" stroke-width="44.27801836669893" />
    <ellipse cx="480" cy="514.5922018489836" rx="304.41137627105513" ry="67.54441736986797" fill="none" stroke="#FFFFFF" stroke-width="4.151064221878025" opacity="0.263802850078136" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 424.65247704162636) rotate(-13.37)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-91.32341288131654,-116.22979821258468 91.32341288131654,-116.22979821258468 114.15426610164567,0 91.32341288131654,116.22979821258468 -91.32341288131654,116.22979821258468 -114.15426610164567,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-68.49255966098741,-87.17234865943851 68.49255966098741,-87.17234865943851 79.14695783047434,0 68.49255966098741,87.17234865943851 -68.49255966098741,87.17234865943851 -79.14695783047434,0" fill="none" stroke="#FFFFFF" stroke-width="2.490638533126815" opacity="0.7391086162600577" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-45.66170644065827,-58.11489910629234 45.66170644065827,-58.11489910629234 53.271990847434644,0 45.66170644065827,58.11489910629234 -45.66170644065827,58.11489910629234 -53.271990847434644,0" fill="#FFFFFF" opacity="0.2000716291030534" />
      
      <!-- Corner Step Cuts -->
      <line x1="-91.32341288131654" y1="-116.22979821258468" x2="-45.66170644065827" y2="-58.11489910629234" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="91.32341288131654" y1="-116.22979821258468" x2="45.66170644065827" y2="-58.11489910629234" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="91.32341288131654" y1="116.22979821258468" x2="45.66170644065827" y2="58.11489910629234" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-91.32341288131654" y1="116.22979821258468" x2="-45.66170644065827" y2="58.11489910629234" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-83.71312847454017" cy="-106.5439816948693" r="9.685816517715391" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="83.71312847454017" cy="-106.5439816948693" r="9.685816517715391" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="83.71312847454017" cy="106.5439816948693" r="9.685816517715391" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-83.71312847454017" cy="106.5439816948693" r="9.685816517715391" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="514.5922018489836" rx="292.2349212202129" ry="57.41275476438778" fill="none" stroke="url(#goldGradient)" stroke-width="19.371633035430783" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(439.3344278176861, 469.4295637115082)" opacity="0.00011938183842229398">
      <ellipse rx="60.016116548187014" ry="4.151064221878025" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.151064221878025" ry="60.016116548187014" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.069504591674733" fill="#C7E84F" opacity="0.9" />
      <circle r="5.534752295837366" fill="#FFFFFF" />
      <circle r="16.004297746183205" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0081 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>