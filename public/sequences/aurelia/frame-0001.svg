<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="72.3%" cy="74.8%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 75.78503934364416%, 81.98629534754573%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 75.78503934364416%, 81.98629534754573%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 3°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="611.5313514760105" rx="200.33236609423147" ry="28.978497113517207" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="505.2944906684636" rx="222.59151788247942" ry="82.7957060386206" fill="none" stroke="url(#goldGradient)" stroke-width="32.37694805563337" />
    <ellipse cx="480" cy="505.2944906684636" rx="222.59151788247942" ry="82.7957060386206" fill="none" stroke="#FFFFFF" stroke-width="3.0353388802156287" opacity="0.6995888604263721" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 439.5288149304583) rotate(0.79)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-66.77745536474383,-84.98948864603759 66.77745536474383,-84.98948864603759 83.47181920592979,0 66.77745536474383,84.98948864603759 -66.77745536474383,84.98948864603759 -83.47181920592979,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-50.08309152355787,-63.7421164845282 50.08309152355787,-63.7421164845282 57.873794649444655,0 50.08309152355787,63.7421164845282 -50.08309152355787,63.7421164845282 -57.873794649444655,0" fill="none" stroke="#FFFFFF" stroke-width="1.8212033281293771" opacity="0.7391086162600576" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-33.388727682371915,-42.49474432301879 33.388727682371915,-42.49474432301879 38.953515629433895,0 33.388727682371915,42.49474432301879 -33.388727682371915,42.49474432301879 -38.953515629433895,0" fill="#FFFFFF" opacity="0.6178995471625834" />
      
      <!-- Corner Step Cuts -->
      <line x1="-66.77745536474383" y1="-84.98948864603759" x2="-33.388727682371915" y2="-42.49474432301879" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="66.77745536474383" y1="-84.98948864603759" x2="33.388727682371915" y2="-42.49474432301879" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="66.77745536474383" y1="84.98948864603759" x2="33.388727682371915" y2="42.49474432301879" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-66.77745536474383" y1="84.98948864603759" x2="-33.388727682371915" y2="42.49474432301879" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-61.21266741768184" cy="-77.9070312588678" r="7.0824573871698" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="61.21266741768184" cy="-77.9070312588678" r="7.0824573871698" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="61.21266741768184" cy="77.9070312588678" r="7.0824573871698" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-61.21266741768184" cy="77.9070312588678" r="7.0824573871698" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="505.2944906684636" rx="213.68785716718023" ry="70.3763501328275" fill="none" stroke="url(#goldGradient)" stroke-width="14.1649147743396" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(530.311849603951, 443.7592057123983)" opacity="0.6964992452709723">
      <ellipse rx="154.02739811158125" ry="3.0353388802156287" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.0353388802156287" ry="154.02739811158125" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.094237013908343" fill="#C7E84F" opacity="0.9" />
      <circle r="4.047118506954171" fill="#FFFFFF" />
      <circle r="41.07397282975501" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0001 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>