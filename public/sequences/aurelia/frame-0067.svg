<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="36.4%" cy="19.5%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 69.62448075682049%, 62.66419573502798%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 69.62448075682049%, 62.66419573502798%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 201°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="667.5204120924914" rx="285.6080122639484" ry="34.05658111723983" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="516.0616177100945" rx="317.34223584883154" ry="97.30451747782809" fill="none" stroke="url(#goldGradient)" stroke-width="46.15887066892095" />
    <ellipse cx="480" cy="516.0616177100945" rx="317.34223584883154" ry="97.30451747782809" fill="none" stroke="#FFFFFF" stroke-width="4.327394125211339" opacity="0.11992587205083949" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.3014116638488) rotate(-5.38)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-95.20267075464946,-121.16703550591748 95.20267075464946,-121.16703550591748 119.00333844331183,0 95.20267075464946,121.16703550591748 -95.20267075464946,121.16703550591748 -119.00333844331183,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.4020030659871,-90.87527662943812 71.4020030659871,-90.87527662943812 82.50898132069621,0 71.4020030659871,90.87527662943812 -71.4020030659871,90.87527662943812 -82.50898132069621,0" fill="none" stroke="#FFFFFF" stroke-width="2.5964364751268034" opacity="0.4772483689529079" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.60133537732473,-60.58351775295874 47.60133537732473,-60.58351775295874 55.53489127354552,0 47.60133537732473,60.58351775295874 -47.60133537732473,60.58351775295874 -55.53489127354552,0" fill="#FFFFFF" opacity="0.7492484327696942" />
      
      <!-- Corner Step Cuts -->
      <line x1="-95.20267075464946" y1="-121.16703550591748" x2="-47.60133537732473" y2="-60.58351775295874" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.20267075464946" y1="-121.16703550591748" x2="47.60133537732473" y2="-60.58351775295874" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.20267075464946" y1="121.16703550591748" x2="47.60133537732473" y2="60.58351775295874" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-95.20267075464946" y1="121.16703550591748" x2="-47.60133537732473" y2="60.58351775295874" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-87.26911485842868" cy="-111.06978254709105" r="10.097252958826457" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.26911485842868" cy="-111.06978254709105" r="10.097252958826457" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.26911485842868" cy="111.06978254709105" r="10.097252958826457" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-87.26911485842868" cy="111.06978254709105" r="10.097252958826457" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="516.0616177100945" rx="304.64854641487824" ry="82.70883985615387" fill="none" stroke="url(#goldGradient)" stroke-width="20.194505917652915" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(533.5980091992013, 460.90930306326777)" opacity="0.9154140546161571">
      <ellipse rx="183.58089737318122" ry="4.327394125211339" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.327394125211339" ry="183.58089737318122" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.539717667230237" fill="#C7E84F" opacity="0.9" />
      <circle r="5.769858833615118" fill="#FFFFFF" />
      <circle r="48.954905966181656" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0067 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>