<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="73.6%" cy="26.4%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60%, 72%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60%, 72%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 270°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="651.365746699413" rx="261.00321420372137" ry="20.761619311659654" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="512.9549512883486" rx="290.0035713374682" ry="59.31891231902759" fill="none" stroke="url(#goldGradient)" stroke-width="42.182337649086286" />
    <ellipse cx="480" cy="512.9549512883486" rx="290.0035713374682" ry="59.31891231902759" fill="none" stroke="#FFFFFF" stroke-width="3.954594154601839" opacity="0.39999999999999997" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 427.27207793864216) rotate(-15.00)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-87.00107140124045,-110.72863632885151 87.00107140124045,-110.72863632885151 108.75133925155058,0 87.00107140124045,110.72863632885151 -87.00107140124045,110.72863632885151 -108.75133925155058,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-65.25080355093034,-83.04647724663863 65.25080355093034,-83.04647724663863 75.40092854774174,0 65.25080355093034,83.04647724663863 -65.25080355093034,83.04647724663863 -75.40092854774174,0" fill="none" stroke="#FFFFFF" stroke-width="2.372756492761104" opacity="0.95" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-43.500535700620226,-55.364318164425754 43.500535700620226,-55.364318164425754 50.750624984056934,0 43.500535700620226,55.364318164425754 -43.500535700620226,55.364318164425754 -50.750624984056934,0" fill="#FFFFFF" opacity="0.5375000000000001" />
      
      <!-- Corner Step Cuts -->
      <line x1="-87.00107140124045" y1="-110.72863632885151" x2="-43.500535700620226" y2="-55.364318164425754" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="87.00107140124045" y1="-110.72863632885151" x2="43.500535700620226" y2="-55.364318164425754" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="87.00107140124045" y1="110.72863632885151" x2="43.500535700620226" y2="55.364318164425754" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-87.00107140124045" y1="110.72863632885151" x2="-43.500535700620226" y2="55.364318164425754" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-79.75098211780376" cy="-101.5012499681139" r="9.227386360737626" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="79.75098211780376" cy="-101.5012499681139" r="9.227386360737626" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="79.75098211780376" cy="101.5012499681139" r="9.227386360737626" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-79.75098211780376" cy="101.5012499681139" r="9.227386360737626" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="512.9549512883486" rx="278.40342848396944" ry="50.42107547117345" fill="none" stroke="url(#goldGradient)" stroke-width="18.45477272147525" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(414.09009742330267, 427.27207793864216)" opacity="0.5625000000000001">
      <ellipse rx="135.9375" ry="3.954594154601839" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.954594154601839" ry="135.9375" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.545584412271571" fill="#C7E84F" opacity="0.9" />
      <circle r="5.272792206135786" fill="#FFFFFF" />
      <circle r="36.25" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0090 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>