<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="78.9%" cy="66.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 71.1177143234622%, 81.65925826289069%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 71.1177143234622%, 81.65925826289069%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 345°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="617.635782244873" rx="209.62988372680658" ry="26.287869781789436" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="506.4684196624756" rx="232.9220930297851" ry="75.10819937654125" fill="none" stroke="url(#goldGradient)" stroke-width="33.87957716796874" />
    <ellipse cx="480" cy="506.4684196624756" rx="232.9220930297851" ry="75.10819937654125" fill="none" stroke="#FFFFFF" stroke-width="3.1762103594970696" opacity="0.6897777478867205" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 437.6505285400391) rotate(-3.88)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-69.87662790893552,-88.93389006591794 69.87662790893552,-88.93389006591794 87.34578488616941,0 69.87662790893552,88.93389006591794 -69.87662790893552,88.93389006591794 -87.34578488616941,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-52.407470931701646,-66.70041754943846 52.407470931701646,-66.70041754943846 60.55974418774412,0 52.407470931701646,66.70041754943846 -52.407470931701646,66.70041754943846 -60.55974418774412,0" fill="none" stroke="#FFFFFF" stroke-width="1.9057262156982417" opacity="0.5232233047033634" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-34.93831395446776,-44.46694503295897 34.93831395446776,-44.46694503295897 40.761366280212386,0 34.93831395446776,44.46694503295897 -34.93831395446776,44.46694503295897 -40.761366280212386,0" fill="#FFFFFF" opacity="0.23750000000000018" />
      
      <!-- Corner Step Cuts -->
      <line x1="-69.87662790893552" y1="-88.93389006591794" x2="-34.93831395446776" y2="-44.46694503295897" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="69.87662790893552" y1="-88.93389006591794" x2="34.93831395446776" y2="-44.46694503295897" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="69.87662790893552" y1="88.93389006591794" x2="34.93831395446776" y2="44.46694503295897" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-69.87662790893552" y1="88.93389006591794" x2="-34.93831395446776" y2="44.46694503295897" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-64.0535755831909" cy="-81.52273256042479" r="7.411157505493162" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="64.0535755831909" cy="-81.52273256042479" r="7.411157505493162" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="64.0535755831909" cy="81.52273256042479" r="7.411157505493162" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-64.0535755831909" cy="81.52273256042479" r="7.411157505493162" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="506.4684196624756" rx="223.6052093085937" ry="63.841969470060064" fill="none" stroke="url(#goldGradient)" stroke-width="14.822315010986324" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(525.8446476514628, 416.47579281005864)" opacity="0.06250000000000028">
      <ellipse rx="68.43750000000004" ry="3.1762103594970696" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.1762103594970696" ry="68.43750000000004" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.469894291992185" fill="#C7E84F" opacity="0.9" />
      <circle r="4.234947145996093" fill="#FFFFFF" />
      <circle r="18.25000000000001" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0115 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>