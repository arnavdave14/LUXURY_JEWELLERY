<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="17.4%" cy="56.9%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 87.58005851918136%, 66.55360964984973%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 87.58005851918136%, 66.55360964984973%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 123°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="661.4108010907249" rx="276.3026047381811" ry="53.40973231093969" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="514.8866925174472" rx="307.00289415353456" ry="152.5992351741134" fill="none" stroke="url(#goldGradient)" stroke-width="44.6549664223323" />
    <ellipse cx="480" cy="514.8866925174472" rx="307.00289415353456" ry="152.5992351741134" fill="none" stroke="#FFFFFF" stroke-width="4.186403102093653" opacity="0.2366082894954919" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 424.18129197208464) rotate(12.58)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-92.10086824606036,-117.2192868586223 92.10086824606036,-117.2192868586223 115.12608530757547,0 92.10086824606036,117.2192868586223 -92.10086824606036,117.2192868586223 -115.12608530757547,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-69.07565118454528,-87.91446514396672 69.07565118454528,-87.91446514396672 79.820752479919,0 69.07565118454528,87.91446514396672 -69.07565118454528,87.91446514396672 -79.820752479919,0" fill="none" stroke="#FFFFFF" stroke-width="2.511841861256192" opacity="0.7391086162600579" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-46.05043412303018,-58.60964342931115 46.05043412303018,-58.60964342931115 53.725506476868546,0 46.05043412303018,58.60964342931115 -46.05043412303018,58.60964342931115 -53.725506476868546,0" fill="#FFFFFF" opacity="0.4570288237343633" />
      
      <!-- Corner Step Cuts -->
      <line x1="-92.10086824606036" y1="-117.2192868586223" x2="-46.05043412303018" y2="-58.60964342931115" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="92.10086824606036" y1="-117.2192868586223" x2="46.05043412303018" y2="-58.60964342931115" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="92.10086824606036" y1="117.2192868586223" x2="46.05043412303018" y2="58.60964342931115" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-92.10086824606036" y1="117.2192868586223" x2="-46.05043412303018" y2="58.60964342931115" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-84.42579589222201" cy="-107.45101295373712" r="9.768273904885191" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="84.42579589222201" cy="-107.45101295373712" r="9.768273904885191" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="84.42579589222201" cy="107.45101295373712" r="9.768273904885191" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-84.42579589222201" cy="107.45101295373712" r="9.768273904885191" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="514.8866925174472" rx="294.72277838739313" ry="129.7093498979964" fill="none" stroke="url(#goldGradient)" stroke-width="19.536547809770383" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(451.62060759487184, 373.188364801704)" opacity="0.42838137289060557">
      <ellipse rx="117.83148534023175" ry="4.186403102093653" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.186403102093653" ry="117.83148534023175" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.163741605583075" fill="#C7E84F" opacity="0.9" />
      <circle r="5.581870802791538" fill="#FFFFFF" />
      <circle r="31.4217294240618" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0041 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>