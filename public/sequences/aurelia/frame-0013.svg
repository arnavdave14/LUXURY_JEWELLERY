<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="53.5%" cy="83.2%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 84.43980586574756%, 79.77145961456971%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 84.43980586574756%, 79.77145961456971%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 39°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="629.5277012651757" rx="227.742191157729" ry="41.0731601575305" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="508.7553271663799" rx="253.04687906414333" ry="117.35188616437287" fill="none" stroke="url(#goldGradient)" stroke-width="36.8068187729663" />
    <ellipse cx="480" cy="508.7553271663799" rx="253.04687906414333" ry="117.35188616437287" fill="none" stroke="#FFFFFF" stroke-width="3.450639259965591" opacity="0.6331437884370912" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 433.99147653379214) rotate(9.44)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-75.91406371924299,-96.61789927903654 75.91406371924299,-96.61789927903654 94.89257964905374,0 75.91406371924299,96.61789927903654 -75.91406371924299,96.61789927903654 -94.89257964905374,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-56.93554778943225,-72.4634244592774 56.93554778943225,-72.4634244592774 65.79218855667726,0 56.93554778943225,72.4634244592774 -56.93554778943225,72.4634244592774 -65.79218855667726,0" fill="none" stroke="#FFFFFF" stroke-width="2.0703835559793546" opacity="0.9227516310470919" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-37.957031859621495,-48.30894963951827 37.957031859621495,-48.30894963951827 44.28320383622508,0 37.957031859621495,48.30894963951827 -37.957031859621495,48.30894963951827 -44.28320383622508,0" fill="#FFFFFF" opacity="0.3202803909646684" />
      
      <!-- Corner Step Cuts -->
      <line x1="-75.91406371924299" y1="-96.61789927903654" x2="-37.957031859621495" y2="-48.30894963951827" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="75.91406371924299" y1="-96.61789927903654" x2="37.957031859621495" y2="-48.30894963951827" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="75.91406371924299" y1="96.61789927903654" x2="37.957031859621495" y2="48.30894963951827" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-75.91406371924299" y1="96.61789927903654" x2="-37.957031859621495" y2="48.30894963951827" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-69.58789174263941" cy="-88.56640767245017" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="69.58789174263941" cy="-88.56640767245017" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="69.58789174263941" cy="88.56640767245017" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-69.58789174263941" cy="88.56640767245017" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="508.7553271663799" rx="242.92500390157758" ry="99.74910323971694" fill="none" stroke="url(#goldGradient)" stroke-width="16.102983213172756" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(491.9571373823598, 478.9946033755684)" opacity="0.20046731827444733">
      <ellipse rx="87.0630879670504" ry="3.450639259965591" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.450639259965591" ry="87.0630879670504" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="9.201704693241576" fill="#C7E84F" opacity="0.9" />
      <circle r="4.600852346620788" fill="#FFFFFF" />
      <circle r="23.216823457880107" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0013 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>