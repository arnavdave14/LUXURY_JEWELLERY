<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="83.2%" cy="53.5%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 65.56019413425244%, 79.77145961456971%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 65.56019413425244%, 79.77145961456971%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 321°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="629.5277012651756" rx="227.74219115772894" ry="23.33877269516052" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="508.7553271663799" rx="253.04687906414327" ry="66.68220770045863" fill="none" stroke="url(#goldGradient)" stroke-width="36.806818772966295" />
    <ellipse cx="480" cy="508.7553271663799" rx="253.04687906414327" ry="66.68220770045863" fill="none" stroke="#FFFFFF" stroke-width="3.45063925996559" opacity="0.6331437884370914" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 433.99147653379214) rotate(-9.44)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-75.91406371924298,-96.61789927903652 75.91406371924298,-96.61789927903652 94.89257964905373,0 75.91406371924298,96.61789927903652 -75.91406371924298,96.61789927903652 -94.89257964905373,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-56.935547789432235,-72.46342445927739 56.935547789432235,-72.46342445927739 65.79218855667725,0 56.935547789432235,72.46342445927739 -56.935547789432235,72.46342445927739 -65.79218855667725,0" fill="none" stroke="#FFFFFF" stroke-width="2.070383555979354" opacity="0.4772483689529078" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-37.95703185962149,-48.30894963951826 37.95703185962149,-48.30894963951826 44.28320383622507,0 37.95703185962149,48.30894963951826 -37.95703185962149,48.30894963951826 -44.28320383622507,0" fill="#FFFFFF" opacity="0.20547117626563674" />
      
      <!-- Corner Step Cuts -->
      <line x1="-75.91406371924298" y1="-96.61789927903652" x2="-37.95703185962149" y2="-48.30894963951826" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="75.91406371924298" y1="-96.61789927903652" x2="37.95703185962149" y2="-48.30894963951826" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="75.91406371924298" y1="96.61789927903652" x2="37.95703185962149" y2="48.30894963951826" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-75.91406371924298" y1="96.61789927903652" x2="-37.95703185962149" y2="48.30894963951826" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-69.5878917426394" cy="-88.56640767245015" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="69.5878917426394" cy="-88.56640767245015" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="69.5878917426394" cy="88.56640767245015" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-69.5878917426394" cy="88.56640767245015" r="8.051491606586378" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="508.7553271663799" rx="242.92500390157753" ry="56.67987654538984" fill="none" stroke="url(#goldGradient)" stroke-width="16.102983213172756" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(491.95713738235986, 388.9883496920159)" opacity="0.009118627109394569">
      <ellipse rx="61.23101465976827" ry="3.45063925996559" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.45063925996559" ry="61.23101465976827" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="9.201704693241574" fill="#C7E84F" opacity="0.9" />
      <circle r="4.600852346620787" fill="#FFFFFF" />
      <circle r="16.328270575938205" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0107 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>