<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="78.9%" cy="33.3%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60.511112605663975%, 74.5881904510252%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60.511112605663975%, 74.5881904510252%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 285°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="645.6125435970102" rx="252.24064332467702" ry="20.5963512788348" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="511.8485660763481" rx="280.26738147186336" ry="58.846717939528" fill="none" stroke="url(#goldGradient)" stroke-width="40.76616457772558" />
    <ellipse cx="480" cy="511.8485660763481" rx="280.26738147186336" ry="58.846717939528" fill="none" stroke="#FFFFFF" stroke-width="3.821827929161773" opacity="0.47764571353075613" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 429.04229427784304) rotate(-14.49)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-84.08021444155901,-107.01118201652965 84.08021444155901,-107.01118201652965 105.10026805194876,0 84.08021444155901,107.01118201652965 -84.08021444155901,107.01118201652965 -105.10026805194876,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-63.060160831169256,-80.25838651239724 63.060160831169256,-80.25838651239724 72.86951918268447,0 63.060160831169256,80.25838651239724 -63.060160831169256,80.25838651239724 -72.86951918268447,0" fill="none" stroke="#FFFFFF" stroke-width="2.293096757497064" opacity="0.8767766952966372" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-42.040107220779504,-53.50559100826482 42.040107220779504,-53.50559100826482 49.04679175757609,0 42.040107220779504,53.50559100826482 -42.040107220779504,53.50559100826482 -49.04679175757609,0" fill="#FFFFFF" opacity="0.8" />
      
      <!-- Corner Step Cuts -->
      <line x1="-84.08021444155901" y1="-107.01118201652965" x2="-42.040107220779504" y2="-53.50559100826482" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="84.08021444155901" y1="-107.01118201652965" x2="42.040107220779504" y2="-53.50559100826482" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="84.08021444155901" y1="107.01118201652965" x2="42.040107220779504" y2="53.50559100826482" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-84.08021444155901" y1="107.01118201652965" x2="-42.040107220779504" y2="53.50559100826482" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-77.07352990476242" cy="-98.09358351515219" r="8.917598501377471" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="77.07352990476242" cy="-98.09358351515219" r="8.917598501377471" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="77.07352990476242" cy="98.09358351515219" r="8.917598501377471" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-77.07352990476242" cy="98.09358351515219" r="8.917598501377471" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="511.8485660763481" rx="269.05668621298884" ry="50.0197102485988" fill="none" stroke="url(#goldGradient)" stroke-width="17.835197002754942" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(424.83666540755047, 403.5634414167646)" opacity="1">
      <ellipse rx="195" ry="3.821827929161773" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.821827929161773" ry="195" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.191541144431396" fill="#C7E84F" opacity="0.9" />
      <circle r="5.095770572215698" fill="#FFFFFF" />
      <circle r="52" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0095 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>