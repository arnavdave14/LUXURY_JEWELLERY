<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="16.8%" cy="46.5%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 84.43980586574756%, 64.22854038543029%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 84.43980586574756%, 64.22854038543029%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 141°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="665.1445272288925" rx="281.98935685631307" ry="50.856602186886" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="515.604716774787" rx="313.3215076181256" ry="145.30457767681716" fill="none" stroke="url(#goldGradient)" stroke-width="45.574037471727365" />
    <ellipse cx="480" cy="515.604716774787" rx="313.3215076181256" ry="145.30457767681716" fill="none" stroke="#FFFFFF" stroke-width="4.2725660129744405" opacity="0.16685621156290875" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 423.03245316034076) rotate(9.44)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-93.99645228543768,-119.63184836328432 93.99645228543768,-119.63184836328432 117.4955653567971,0 93.99645228543768,119.63184836328432 -93.99645228543768,119.63184836328432 -117.4955653567971,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-70.49733921407827,-89.72388627246325 70.49733921407827,-89.72388627246325 81.46359198071266,0 70.49733921407827,89.72388627246325 -70.49733921407827,89.72388627246325 -81.46359198071266,0" fill="none" stroke="#FFFFFF" stroke-width="2.5635396077846644" opacity="0.922751631047092" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-46.99822614271884,-59.81592418164216 46.99822614271884,-59.81592418164216 54.83126383317198,0 46.99822614271884,59.81592418164216 -46.99822614271884,59.81592418164216 -54.83126383317198,0" fill="#FFFFFF" opacity="0.20547117626563685" />
      
      <!-- Corner Step Cuts -->
      <line x1="-93.99645228543768" y1="-119.63184836328432" x2="-46.99822614271884" y2="-59.81592418164216" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="93.99645228543768" y1="-119.63184836328432" x2="46.99822614271884" y2="-59.81592418164216" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="93.99645228543768" y1="119.63184836328432" x2="46.99822614271884" y2="59.81592418164216" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-93.99645228543768" y1="119.63184836328432" x2="-46.99822614271884" y2="59.81592418164216" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-86.16341459498456" cy="-109.66252766634398" r="9.969320696940361" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="86.16341459498456" cy="-109.66252766634398" r="9.969320696940361" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="86.16341459498456" cy="109.66252766634398" r="9.969320696940361" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-86.16341459498456" cy="109.66252766634398" r="9.969320696940361" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="515.604716774787" rx="300.7886473134006" ry="123.50889102529459" fill="none" stroke="url(#goldGradient)" stroke-width="19.938641393880722" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(494.8052737314668, 367.30978389943743)" opacity="0.009118627109394739">
      <ellipse rx="61.23101465976829" ry="4.2725660129744405" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.2725660129744405" ry="61.23101465976829" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.393509367931841" fill="#C7E84F" opacity="0.9" />
      <circle r="5.696754683965921" fill="#FFFFFF" />
      <circle r="16.328270575938213" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0047 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>