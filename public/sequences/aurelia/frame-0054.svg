<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="20.3%" cy="34.9%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 79.63525491562422%, 62.489434837048464%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 79.63525491562422%, 62.489434837048464%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 162°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="667.7797679248156" rx="286.0030311470268" ry="45.912815081766105" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="516.1114938316953" rx="317.78114571891865" ry="131.1794716621889" fill="none" stroke="url(#goldGradient)" stroke-width="46.222712104569986" />
    <ellipse cx="480" cy="516.1114938316953" rx="317.78114571891865" ry="131.1794716621889" fill="none" stroke="#FFFFFF" stroke-width="4.333379259803436" opacity="0.114683045111454" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.22160986928753) rotate(4.64)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-95.33434371567559,-121.3346192744962 95.33434371567559,-121.3346192744962 119.1679296445945,0 95.33434371567559,121.3346192744962 -95.33434371567559,121.3346192744962 -119.1679296445945,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.5007577867567,-91.00096445587216 71.5007577867567,-91.00096445587216 82.62309788691886,0 71.5007577867567,91.00096445587216 -71.5007577867567,91.00096445587216 -82.62309788691886,0" fill="none" stroke="#FFFFFF" stroke-width="2.6000275558820616" opacity="0.9022542485937368" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.66717185783779,-60.6673096372481 47.66717185783779,-60.6673096372481 55.61170050081076,0 47.66717185783779,60.6673096372481 -47.66717185783779,60.6673096372481 -55.61170050081076,0" fill="#FFFFFF" opacity="0.21642118334726845" />
      
      <!-- Corner Step Cuts -->
      <line x1="-95.33434371567559" y1="-121.3346192744962" x2="-47.66717185783779" y2="-60.6673096372481" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.33434371567559" y1="-121.3346192744962" x2="47.66717185783779" y2="-60.6673096372481" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.33434371567559" y1="121.3346192744962" x2="47.66717185783779" y2="60.6673096372481" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-95.33434371567559" y1="121.3346192744962" x2="-47.66717185783779" y2="60.6673096372481" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-87.38981507270263" cy="-111.22340100162154" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.38981507270263" cy="-111.22340100162154" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.38981507270263" cy="111.22340100162154" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-87.38981507270263" cy="111.22340100162154" r="10.111218272874684" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="516.1114938316953" rx="305.0698998901619" ry="111.50255091286056" fill="none" stroke="url(#goldGradient)" stroke-width="20.222436545749368" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(538.4296244042151, 388.26032424925376)" opacity="0.027368638912114076">
      <ellipse rx="63.6947662531354" ry="4.333379259803436" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.333379259803436" ry="63.6947662531354" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.555678026142497" fill="#C7E84F" opacity="0.9" />
      <circle r="5.777839013071248" fill="#FFFFFF" />
      <circle r="16.985271000836107" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0054 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>