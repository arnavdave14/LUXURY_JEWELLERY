<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="30.4%" cy="77.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 89.81532510892707%, 73.5643446504023%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 89.81532510892707%, 73.5643446504023%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 81°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="647.9927108273157" rx="255.86582110621936" ry="51.81823319293417" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="512.3062905437146" rx="284.2953567846882" ry="148.05209483695478" fill="none" stroke="url(#goldGradient)" stroke-width="41.352051895954645" />
    <ellipse cx="480" cy="512.3062905437146" rx="284.2953567846882" ry="148.05209483695478" fill="none" stroke="#FFFFFF" stroke-width="3.876754865245748" opacity="0.4469303395120693" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 428.3099351300567) rotate(14.82)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-85.28860703540646,-108.54913622688095 85.28860703540646,-108.54913622688095 106.61075879425806,0 85.28860703540646,108.54913622688095 -85.28860703540646,108.54913622688095 -106.61075879425806,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-63.96645527655484,-81.41185217016071 63.96645527655484,-81.41185217016071 73.91679276401894,0 63.96645527655484,81.41185217016071 -63.96645527655484,81.41185217016071 -73.91679276401894,0" fill="none" stroke="#FFFFFF" stroke-width="2.326052919147449" opacity="0.477248368952908" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-42.64430351770323,-54.27456811344047 42.64430351770323,-54.27456811344047 49.75168743732043,0 42.64430351770323,54.27456811344047 -42.64430351770323,54.27456811344047 -49.75168743732043,0" fill="#FFFFFF" opacity="0.3202803909646683" />
      
      <!-- Corner Step Cuts -->
      <line x1="-85.28860703540646" y1="-108.54913622688095" x2="-42.64430351770323" y2="-54.27456811344047" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="85.28860703540646" y1="-108.54913622688095" x2="42.64430351770323" y2="-54.27456811344047" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="85.28860703540646" y1="108.54913622688095" x2="42.64430351770323" y2="54.27456811344047" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-85.28860703540646" y1="108.54913622688095" x2="-42.64430351770323" y2="54.27456811344047" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-78.18122311578925" cy="-99.50337487464088" r="9.045761352240078" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="78.18122311578925" cy="-99.50337487464088" r="9.045761352240078" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="78.18122311578925" cy="99.50337487464088" r="9.045761352240078" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-78.18122311578925" cy="99.50337487464088" r="9.045761352240078" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="512.3062905437146" rx="272.9235425133006" ry="125.84428061141156" fill="none" stroke="url(#goldGradient)" stroke-width="18.091522704480155" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(418.5497837221515, 444.28304361521265)" opacity="0.2004673182744472">
      <ellipse rx="87.06308796705036" ry="3.876754865245748" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.876754865245748" ry="87.06308796705036" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.338012973988661" fill="#C7E84F" opacity="0.9" />
      <circle r="5.169006486994331" fill="#FFFFFF" />
      <circle r="23.2168234578801" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0027 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>