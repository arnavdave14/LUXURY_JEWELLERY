<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="25.2%" cy="27.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 75.78503934364416%, 62.013704652454265%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 75.78503934364416%, 62.013704652454265%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 177°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="668.4799535110701" rx="287.06946765532217" ry="41.52520085504154" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="516.246144905975" rx="318.9660751725802" ry="118.6434310144044" fill="none" stroke="url(#goldGradient)" stroke-width="46.395065479648025" />
    <ellipse cx="480" cy="516.246144905975" rx="318.9660751725802" ry="118.6434310144044" fill="none" stroke="#FFFFFF" stroke-width="4.349537388717002" opacity="0.1004111395736279" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 422.00616815044) rotate(0.79)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-95.68982255177406,-121.78704688407606 95.68982255177406,-121.78704688407606 119.61227818971757,0 95.68982255177406,121.78704688407606 -95.68982255177406,121.78704688407606 -119.61227818971757,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-71.76736691383054,-91.34028516305705 71.76736691383054,-91.34028516305705 82.93117954487086,0 71.76736691383054,91.34028516305705 -71.76736691383054,91.34028516305705 -82.93117954487086,0" fill="none" stroke="#FFFFFF" stroke-width="2.6097224332302016" opacity="0.739108616260058" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-47.84491127588703,-60.89352344203803 47.84491127588703,-60.89352344203803 55.81906315520153,0 47.84491127588703,60.89352344203803 -47.84491127588703,60.89352344203803 -55.81906315520153,0" fill="#FFFFFF" opacity="0.4570288237343623" />
      
      <!-- Corner Step Cuts -->
      <line x1="-95.68982255177406" y1="-121.78704688407606" x2="-47.84491127588703" y2="-60.89352344203803" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.68982255177406" y1="-121.78704688407606" x2="47.84491127588703" y2="-60.89352344203803" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="95.68982255177406" y1="121.78704688407606" x2="47.84491127588703" y2="60.89352344203803" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-95.68982255177406" y1="121.78704688407606" x2="-47.84491127588703" y2="60.89352344203803" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-87.71567067245955" cy="-111.63812631040307" r="10.148920573673006" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.71567067245955" cy="-111.63812631040307" r="10.148920573673006" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="87.71567067245955" cy="111.63812631040307" r="10.148920573673006" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-87.71567067245955" cy="111.63812631040307" r="10.148920573673006" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="516.246144905975" rx="306.20743216567695" ry="100.84691636224373" fill="none" stroke="url(#goldGradient)" stroke-width="20.297841147346013" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(552.0951694633667, 415.9441620282027)" opacity="0.4283813728906039">
      <ellipse rx="117.83148534023154" ry="4.349537388717002" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.349537388717002" ry="117.83148534023154" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.598766369912006" fill="#C7E84F" opacity="0.9" />
      <circle r="5.799383184956003" fill="#FFFFFF" />
      <circle r="31.421729424061745" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0059 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>