<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="48.3%" cy="16.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 64.96304090461713%, 64.56855174522606%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 64.96304090461713%, 64.56855174522606%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 222°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="664.6144549500863" rx="281.18201600090066" ry="28.122675052740302" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="515.5027797980936" rx="312.424462223223" ry="80.35050015068659" fill="none" stroke="url(#goldGradient)" stroke-width="45.443558141559706" />
    <ellipse cx="480" cy="515.5027797980936" rx="312.424462223223" ry="80.35050015068659" fill="none" stroke="#FFFFFF" stroke-width="4.260333575771222" opacity="0.17705655235678175" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 423.1955523230504) rotate(-10.04)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-93.72733866696689,-119.28934012159422 93.72733866696689,-119.28934012159422 117.15917333370862,0 93.72733866696689,119.28934012159422 -93.72733866696689,119.28934012159422 -117.15917333370862,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-70.29550400022516,-89.46700509119567 70.29550400022516,-89.46700509119567 81.23036017803797,0 70.29550400022516,89.46700509119567 -70.29550400022516,89.46700509119567 -81.23036017803797,0" fill="none" stroke="#FFFFFF" stroke-width="2.5562001454627334" opacity="0.49774575140626304" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-46.86366933348344,-59.64467006079711 46.86366933348344,-59.64467006079711 54.674280889064015,0 46.86366933348344,59.64467006079711 -46.86366933348344,59.64467006079711 -54.674280889064015,0" fill="#FFFFFF" opacity="0.27161862710939483" />
      
      <!-- Corner Step Cuts -->
      <line x1="-93.72733866696689" y1="-119.28934012159422" x2="-46.86366933348344" y2="-59.64467006079711" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="93.72733866696689" y1="-119.28934012159422" x2="46.86366933348344" y2="-59.64467006079711" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="93.72733866696689" y1="119.28934012159422" x2="46.86366933348344" y2="59.64467006079711" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-93.72733866696689" y1="119.28934012159422" x2="-46.86366933348344" y2="59.64467006079711" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-85.91672711138632" cy="-109.34856177812804" r="9.940778343466185" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="85.91672711138632" cy="-109.34856177812804" r="9.940778343466185" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="85.91672711138632" cy="109.34856177812804" r="9.940778343466185" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-85.91672711138632" cy="109.34856177812804" r="9.940778343466185" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="515.5027797980936" rx="299.92748373429407" ry="68.29792512808359" fill="none" stroke="url(#goldGradient)" stroke-width="19.88155668693237" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(487.4221020280492, 479.6888192920782)" opacity="0.11936437851565805">
      <ellipse rx="76.11419109961383" ry="4.260333575771222" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.260333575771222" ry="76.11419109961383" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.360889535389926" fill="#C7E84F" opacity="0.9" />
      <circle r="5.680444767694963" fill="#FFFFFF" />
      <circle r="20.29711762656369" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0074 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>