<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="16.8%" cy="53.5%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 86.65718942185457%, 65.70679608950162%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 86.65718942185457%, 65.70679608950162%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 129°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="662.8012391344669" rx="278.42034883557255" ry="52.75930341433009" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="515.1540844489359" rx="309.35594315063616" ry="150.74086689808598" fill="none" stroke="url(#goldGradient)" stroke-width="44.99722809463799" />
    <ellipse cx="480" cy="515.1540844489359" rx="309.35594315063616" ry="150.74086689808598" fill="none" stroke="#FFFFFF" stroke-width="4.2184901338723115" opacity="0.21120388268504883" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 423.7534648817025) rotate(11.66)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-92.80678294519085,-118.11772374842471 92.80678294519085,-118.11772374842471 116.00847868148855,0 92.80678294519085,118.11772374842471 -92.80678294519085,118.11772374842471 -116.00847868148855,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-69.60508720889314,-88.58829281131854 69.60508720889314,-88.58829281131854 80.4325452191654,0 69.60508720889314,88.58829281131854 -69.60508720889314,88.58829281131854 -80.4325452191654,0" fill="none" stroke="#FFFFFF" stroke-width="2.531094080323387" opacity="0.8134976249348864" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-46.40339147259542,-59.058861874212354 46.40339147259542,-59.058861874212354 54.137290051361326,0 46.40339147259542,59.058861874212354 -46.40339147259542,59.058861874212354 -54.137290051361326,0" fill="#FFFFFF" opacity="0.320280390964669" />
      
      <!-- Corner Step Cuts -->
      <line x1="-92.80678294519085" y1="-118.11772374842471" x2="-46.40339147259542" y2="-59.058861874212354" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="92.80678294519085" y1="-118.11772374842471" x2="46.40339147259542" y2="-59.058861874212354" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="92.80678294519085" y1="118.11772374842471" x2="46.40339147259542" y2="59.058861874212354" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-92.80678294519085" y1="118.11772374842471" x2="-46.40339147259542" y2="59.058861874212354" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-85.07288436642496" cy="-108.27458010272267" r="9.84314364570206" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="85.07288436642496" cy="-108.27458010272267" r="9.84314364570206" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="85.07288436642496" cy="108.27458010272267" r="9.84314364570206" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-85.07288436642496" cy="108.27458010272267" r="9.84314364570206" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="515.1540844489359" rx="296.9817054246107" ry="128.12973686337307" fill="none" stroke="url(#goldGradient)" stroke-width="19.68628729140412" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(465.38210972614286, 368.73605150615003)" opacity="0.20046731827444825">
      <ellipse rx="87.06308796705052" ry="4.2184901338723115" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.2184901338723115" ry="87.06308796705052" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.249307023659497" fill="#C7E84F" opacity="0.9" />
      <circle r="5.624653511829749" fill="#FFFFFF" />
      <circle r="23.21682345788014" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0043 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>