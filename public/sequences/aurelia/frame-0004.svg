<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="68.2%" cy="78.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 78.11867536226639%, 81.78147600733806%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 78.11867536226639%, 81.78147600733806%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 12°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="616.1149151011577" rx="207.31348607714793" ry="31.983778300760275" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="506.17594521176113" rx="230.3483178634977" ry="91.38222371645793" fill="none" stroke="url(#goldGradient)" stroke-width="33.50520987105421" />
    <ellipse cx="480" cy="506.17594521176113" rx="230.3483178634977" ry="91.38222371645793" fill="none" stroke="#FFFFFF" stroke-width="3.1411134254113326" opacity="0.6934442802201417" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 438.11848766118226) rotate(3.12)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-69.10449535904931,-87.95117591151731 69.10449535904931,-87.95117591151731 86.38061919881164,0 69.10449535904931,87.95117591151731 -69.10449535904931,87.95117591151731 -86.38061919881164,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-51.82837151928698,-65.96338193363799 51.82837151928698,-65.96338193363799 59.8905626445094,0 51.82837151928698,65.96338193363799 -51.82837151928698,65.96338193363799 -59.8905626445094,0" fill="none" stroke="#FFFFFF" stroke-width="1.8846680552467996" opacity="0.8469463130731183" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-34.552247679524655,-43.975587955758655 34.552247679524655,-43.975587955758655 40.3109556261121,0 34.552247679524655,43.975587955758655 -34.552247679524655,43.975587955758655 -40.3109556261121,0" fill="#FFFFFF" opacity="0.7869601895433367" />
      
      <!-- Corner Step Cuts -->
      <line x1="-69.10449535904931" y1="-87.95117591151731" x2="-34.552247679524655" y2="-43.975587955758655" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="69.10449535904931" y1="-87.95117591151731" x2="34.552247679524655" y2="-43.975587955758655" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="69.10449535904931" y1="87.95117591151731" x2="34.552247679524655" y2="43.975587955758655" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-69.10449535904931" y1="87.95117591151731" x2="-34.552247679524655" y2="43.975587955758655" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-63.345787412461874" cy="-80.62191125222421" r="7.329264659293109" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="63.345787412461874" cy="-80.62191125222421" r="7.329264659293109" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="63.345787412461874" cy="80.62191125222421" r="7.329264659293109" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-63.345787412461874" cy="80.62191125222421" r="7.329264659293109" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="506.17594521176113" rx="221.1343851489578" ry="77.67489015898924" fill="none" stroke="url(#goldGradient)" stroke-width="14.658529318586218" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(527.8258316954119, 455.1532333968107)" opacity="0.9782669825722278">
      <ellipse rx="192.06604264725075" ry="3.1411134254113326" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.1411134254113326" ry="192.06604264725075" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.376302467763553" fill="#C7E84F" opacity="0.9" />
      <circle r="4.188151233881777" fill="#FFFFFF" />
      <circle r="51.2176113726002" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0004 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>