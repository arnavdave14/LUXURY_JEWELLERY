<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="31.8%" cy="78.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 89.67221401100709%, 74.0791169081776%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 89.67221401100709%, 74.0791169081776%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 78°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="646.8152428764155" rx="254.0724468425405" ry="51.30506490738997" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="512.0798543993106" rx="282.30271871393387" ry="146.58589973539992" fill="none" stroke="url(#goldGradient)" stroke-width="41.06221363111766" />
    <ellipse cx="480" cy="512.0798543993106" rx="282.30271871393387" ry="146.58589973539992" fill="none" stroke="#FFFFFF" stroke-width="3.8495825279172804" opacity="0.4623735072453278" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 428.6722329611029) rotate(14.67)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-84.69081561418015,-107.78831078168385 84.69081561418015,-107.78831078168385 105.8635195177252,0 84.69081561418015,107.78831078168385 -84.69081561418015,107.78831078168385 -105.8635195177252,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-63.518111710635125,-80.84123308626289 63.518111710635125,-80.84123308626289 73.39870686562281,0 63.518111710635125,80.84123308626289 -63.518111710635125,80.84123308626289 -73.39870686562281,0" fill="none" stroke="#FFFFFF" stroke-width="2.3097495167503683" opacity="0.4977457514062631" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-42.345407807090076,-53.894155390841924 42.345407807090076,-53.894155390841924 49.402975774938426,0 42.345407807090076,53.894155390841924 -42.345407807090076,53.894155390841924 -49.402975774938426,0" fill="#FFFFFF" opacity="0.27161862710939466" />
      
      <!-- Corner Step Cuts -->
      <line x1="-84.69081561418015" y1="-107.78831078168385" x2="-42.345407807090076" y2="-53.894155390841924" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="84.69081561418015" y1="-107.78831078168385" x2="42.345407807090076" y2="-53.894155390841924" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="84.69081561418015" y1="107.78831078168385" x2="42.345407807090076" y2="53.894155390841924" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-84.69081561418015" y1="107.78831078168385" x2="-42.345407807090076" y2="53.894155390841924" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-77.63324764633182" cy="-98.80595154987687" r="8.982359231806988" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="77.63324764633182" cy="-98.80595154987687" r="8.982359231806988" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="77.63324764633182" cy="98.80595154987687" r="8.982359231806988" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-77.63324764633182" cy="98.80595154987687" r="8.982359231806988" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="512.0798543993106" rx="271.0106099653765" ry="124.59801477508992" fill="none" stroke="url(#goldGradient)" stroke-width="17.964718463613977" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(421.38718946334745, 449.5491166230806)" opacity="0.11936437851565777">
      <ellipse rx="76.1141910996138" ry="3.8495825279172804" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.8495825279172804" ry="76.1141910996138" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.265553407779414" fill="#C7E84F" opacity="0.9" />
      <circle r="5.132776703889707" fill="#FFFFFF" />
      <circle r="20.297117626563683" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0026 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>