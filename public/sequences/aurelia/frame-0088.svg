<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="71.0%" cy="24.1%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60.0821715694759%, 70.95471536732346%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60.0821715694759%, 70.95471536732346%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 264°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="653.4739722904276" rx="264.2142039500359" ry="21.106587258231272" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="513.3603792866207" rx="293.57133772226206" ry="60.30453502351792" fill="none" stroke="url(#goldGradient)" stroke-width="42.70128548687448" />
    <ellipse cx="480" cy="513.3603792866207" rx="293.57133772226206" ry="60.30453502351792" fill="none" stroke="#FFFFFF" stroke-width="4.003245514394482" opacity="0.36864146101970374" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 426.6233931414069) rotate(-14.92)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-88.07140131667862,-112.09087440304552 88.07140131667862,-112.09087440304552 110.08925164584826,0 88.07140131667862,112.09087440304552 -88.07140131667862,112.09087440304552 -110.08925164584826,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-66.05355098750897,-84.06815580228414 66.05355098750897,-84.06815580228414 76.32854780778814,0 66.05355098750897,84.06815580228414 -66.05355098750897,84.06815580228414 -76.32854780778814,0" fill="none" stroke="#FFFFFF" stroke-width="2.40194730863669" opacity="0.9377641290737881" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-44.03570065833931,-56.04543720152276 44.03570065833931,-56.04543720152276 51.37498410139586,0 44.03570065833931,56.04543720152276 -44.03570065833931,56.04543720152276 -51.37498410139586,0" fill="#FFFFFF" opacity="0.38299746892526" />
      
      <!-- Corner Step Cuts -->
      <line x1="-88.07140131667862" y1="-112.09087440304552" x2="-44.03570065833931" y2="-56.04543720152276" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="88.07140131667862" y1="-112.09087440304552" x2="44.03570065833931" y2="-56.04543720152276" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="88.07140131667862" y1="112.09087440304552" x2="44.03570065833931" y2="56.04543720152276" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-88.07140131667862" y1="112.09087440304552" x2="-44.03570065833931" y2="56.04543720152276" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-80.73211787362207" cy="-102.74996820279173" r="9.340906200253793" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="80.73211787362207" cy="-102.74996820279173" r="9.340906200253793" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="80.73211787362207" cy="102.74996820279173" r="9.340906200253793" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-80.73211787362207" cy="102.74996820279173" r="9.340906200253793" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="513.3603792866207" rx="281.82848421337155" ry="51.25885476999023" fill="none" stroke="url(#goldGradient)" stroke-width="18.681812400507585" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(414.73725008244446, 437.72101372349186)" opacity="0.30499578154209994">
      <ellipse rx="101.1744305081835" ry="4.003245514394482" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.003245514394482" ry="101.1744305081835" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.67532137171862" fill="#C7E84F" opacity="0.9" />
      <circle r="5.33766068585931" fill="#FFFFFF" />
      <circle r="26.979848135515603" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0088 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>