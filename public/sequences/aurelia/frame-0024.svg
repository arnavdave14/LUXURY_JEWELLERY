<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="34.9%" cy="79.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 89.2658477444273%, 75.09016994374947%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 89.2658477444273%, 75.09016994374947%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 72°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="644.3854372591097" rx="250.37166597925935" ry="50.13811768499269" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="511.6125840882903" rx="278.19073997695483" ry="143.25176481426485" fill="none" stroke="url(#goldGradient)" stroke-width="40.464107633011615" />
    <ellipse cx="480" cy="511.6125840882903" rx="278.19073997695483" ry="143.25176481426485" fill="none" stroke="#FFFFFF" stroke-width="3.7935100905948387" opacity="0.49270509831248427" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 429.4198654587355) rotate(14.27)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-83.45722199308645,-106.21828253665548 83.45722199308645,-106.21828253665548 104.32152749135807,0 83.45722199308645,106.21828253665548 -83.45722199308645,106.21828253665548 -104.32152749135807,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-62.59291649481484,-79.66371190249161 62.59291649481484,-79.66371190249161 72.32959239400826,0 62.59291649481484,79.66371190249161 -62.59291649481484,79.66371190249161 -72.32959239400826,0" fill="none" stroke="#FFFFFF" stroke-width="2.2761060543569034" opacity="0.5530536869268817" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-41.728610996543225,-53.10914126832774 41.728610996543225,-53.10914126832774 48.683379495967095,0 41.728610996543225,53.10914126832774 -41.728610996543225,53.10914126832774 -48.683379495967095,0" fill="#FFFFFF" opacity="0.21642118334726848" />
      
      <!-- Corner Step Cuts -->
      <line x1="-83.45722199308645" y1="-106.21828253665548" x2="-41.728610996543225" y2="-53.10914126832774" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="83.45722199308645" y1="-106.21828253665548" x2="41.728610996543225" y2="-53.10914126832774" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="83.45722199308645" y1="106.21828253665548" x2="41.728610996543225" y2="53.10914126832774" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-83.45722199308645" y1="106.21828253665548" x2="-41.728610996543225" y2="53.10914126832774" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-76.50245349366259" cy="-97.3667589919342" r="8.85152354472129" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="76.50245349366259" cy="-97.3667589919342" r="8.85152354472129" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="76.50245349366259" cy="97.3667589919342" r="8.85152354472129" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-76.50245349366259" cy="97.3667589919342" r="8.85152354472129" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="511.6125840882903" rx="267.0631103778766" ry="121.76400009212512" fill="none" stroke="url(#goldGradient)" stroke-width="17.70304708944258" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(428.8497644729322, 459.15012260105993)" opacity="0.027368638912114104">
      <ellipse rx="63.6947662531354" ry="3.7935100905948387" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.7935100905948387" ry="63.6947662531354" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.116026908252904" fill="#C7E84F" opacity="0.9" />
      <circle r="5.058013454126452" fill="#FFFFFF" />
      <circle r="16.985271000836107" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0024 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>