<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="82.6%" cy="56.9%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 66.8304144747746%, 80.38670567945424%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 66.8304144747746%, 80.38670567945424%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 327°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="626.6148976651795" rx="223.3057672131195" ry="24.054059453314956" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="508.19517262791913" rx="248.11751912568835" ry="68.72588415232845" fill="none" stroke="url(#goldGradient)" stroke-width="36.089820963736486" />
    <ellipse cx="480" cy="508.19517262791913" rx="248.11751912568835" ry="68.72588415232845" fill="none" stroke="#FFFFFF" stroke-width="3.3834207153502955" opacity="0.6516011703836273" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 434.8877237953294) rotate(-8.17)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-74.4352557377065,-94.73578002980828 74.4352557377065,-94.73578002980828 93.04406967213313,0 74.4352557377065,94.73578002980828 -74.4352557377065,94.73578002980828 -93.04406967213313,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-55.82644180327988,-71.05183502235622 55.82644180327988,-71.05183502235622 64.51055497267897,0 55.82644180327988,71.05183502235622 -55.82644180327988,71.05183502235622 -64.51055497267897,0" fill="none" stroke="#FFFFFF" stroke-width="2.0300524292101776" opacity="0.4530779148512155" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-37.21762786885325,-47.36789001490414 37.21762786885325,-47.36789001490414 43.42056584699546,0 37.21762786885325,47.36789001490414 -37.21762786885325,47.36789001490414 -43.42056584699546,0" fill="#FFFFFF" opacity="0.20007162910305337" />
      
      <!-- Corner Step Cuts -->
      <line x1="-74.4352557377065" y1="-94.73578002980828" x2="-37.21762786885325" y2="-47.36789001490414" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="74.4352557377065" y1="-94.73578002980828" x2="37.21762786885325" y2="-47.36789001490414" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="74.4352557377065" y1="94.73578002980828" x2="37.21762786885325" y2="47.36789001490414" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-74.4352557377065" y1="94.73578002980828" x2="-37.21762786885325" y2="47.36789001490414" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-68.2323177595643" cy="-86.84113169399093" r="7.894648335817356" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="68.2323177595643" cy="-86.84113169399093" r="7.894648335817356" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="68.2323177595643" cy="86.84113169399093" r="7.894648335817356" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-68.2323177595643" cy="86.84113169399093" r="7.894648335817356" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="508.19517262791913" rx="238.1928183606608" ry="58.41700152947918" fill="none" stroke="url(#goldGradient)" stroke-width="15.789296671634713" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(502.93601973124504, 393.67560878463416)" opacity="0.00011938183842228981">
      <ellipse rx="60.016116548187014" ry="3.3834207153502955" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.3834207153502955" ry="60.016116548187014" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="9.022455240934121" fill="#C7E84F" opacity="0.9" />
      <circle r="4.511227620467061" fill="#FFFFFF" />
      <circle r="16.004297746183205" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0109 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>