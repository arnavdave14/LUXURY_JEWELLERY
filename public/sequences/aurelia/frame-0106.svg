<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="83.3%" cy="51.7%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 64.96304090461712%, 79.43144825477394%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 64.96304090461712%, 79.43144825477394%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 318°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="630.9645250484001" rx="229.93058430448627" ry="22.996716500748974" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="509.0316394323846" rx="255.47842700498475" ry="65.70490428785422" fill="none" stroke="url(#goldGradient)" stroke-width="37.16049847345233" />
    <ellipse cx="480" cy="509.0316394323846" rx="255.47842700498475" ry="65.70490428785422" fill="none" stroke="#FFFFFF" stroke-width="3.483796731886156" opacity="0.6229434476432181" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 433.54937690818457) rotate(-10.04)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-76.64352810149542,-97.54630849281237 76.64352810149542,-97.54630849281237 95.80441012686929,0 76.64352810149542,97.54630849281237 -76.64352810149542,97.54630849281237 -95.80441012686929,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-57.48264607612157,-73.15973136960928 57.48264607612157,-73.15973136960928 66.42439102129603,0 57.48264607612157,73.15973136960928 -57.48264607612157,73.15973136960928 -66.42439102129603,0" fill="none" stroke="#FFFFFF" stroke-width="2.0902780391316935" opacity="0.4977457514062634" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-38.32176405074771,-48.773154246406186 38.32176405074771,-48.773154246406186 44.70872472587233,0 38.32176405074771,48.773154246406186 -38.32176405074771,48.773154246406186 -44.70872472587233,0" fill="#FFFFFF" opacity="0.2164211833472687" />
      
      <!-- Corner Step Cuts -->
      <line x1="-76.64352810149542" y1="-97.54630849281237" x2="-38.32176405074771" y2="-48.773154246406186" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="76.64352810149542" y1="-97.54630849281237" x2="38.32176405074771" y2="-48.773154246406186" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="76.64352810149542" y1="97.54630849281237" x2="38.32176405074771" y2="48.773154246406186" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-76.64352810149542" y1="97.54630849281237" x2="-38.32176405074771" y2="48.773154246406186" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-70.25656742637081" cy="-89.41744945174467" r="8.128859041067697" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="70.25656742637081" cy="-89.41744945174467" r="8.128859041067697" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="70.25656742637081" cy="89.41744945174467" r="8.128859041067697" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-70.25656742637081" cy="89.41744945174467" r="8.128859041067697" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="509.0316394323846" rx="245.25928992478535" ry="55.849168644676084" fill="none" stroke="url(#goldGradient)" stroke-width="16.257718082135394" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(486.0692653120155, 387.353215189875)" opacity="0.02736863891211448">
      <ellipse rx="63.694766253135455" ry="3.483796731886156" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.483796731886156" ry="63.694766253135455" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="9.290124618363082" fill="#C7E84F" opacity="0.9" />
      <circle r="4.645062309181541" fill="#FFFFFF" />
      <circle r="16.98527100083612" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0106 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>