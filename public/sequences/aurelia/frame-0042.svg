<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="17.1%" cy="55.2%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 87.13525491562422%, 66.12214747707527%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 87.13525491562422%, 66.12214747707527%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 126°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="662.1238816650196" rx="277.3886813051836" ry="53.110767689539" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="515.0238233971191" rx="308.2096458946484" ry="151.74505054154002" fill="none" stroke="url(#goldGradient)" stroke-width="44.830493948312494" />
    <ellipse cx="480" cy="515.0238233971191" rx="308.2096458946484" ry="151.74505054154002" fill="none" stroke="#FFFFFF" stroke-width="4.202858807654296" opacity="0.2236644243122581" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 423.96188256460937) rotate(12.14)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-92.46289376839452,-117.68004661432029 92.46289376839452,-117.68004661432029 115.57861721049315,0 92.46289376839452,117.68004661432029 -92.46289376839452,117.68004661432029 -115.57861721049315,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-69.3471703262959,-88.26003496074023 69.3471703262959,-88.26003496074023 80.13450793260859,0 69.3471703262959,88.26003496074023 -69.3471703262959,88.26003496074023 -80.13450793260859,0" fill="none" stroke="#FFFFFF" stroke-width="2.521715284592578" opacity="0.7772542485937367" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-46.23144688419726,-58.840023307160145 46.23144688419726,-58.840023307160145 53.93668803156347,0 46.23144688419726,58.840023307160145 -46.23144688419726,58.840023307160145 -53.93668803156347,0" fill="#FFFFFF" opacity="0.382997468925261" />
      
      <!-- Corner Step Cuts -->
      <line x1="-92.46289376839452" y1="-117.68004661432029" x2="-46.23144688419726" y2="-58.840023307160145" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="92.46289376839452" y1="-117.68004661432029" x2="46.23144688419726" y2="-58.840023307160145" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="92.46289376839452" y1="117.68004661432029" x2="46.23144688419726" y2="58.840023307160145" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-92.46289376839452" y1="117.68004661432029" x2="-46.23144688419726" y2="58.840023307160145" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-84.75765262102833" cy="-107.87337606312694" r="9.806670551193358" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="84.75765262102833" cy="-107.87337606312694" r="9.806670551193358" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="84.75765262102833" cy="107.87337606312694" r="9.806670551193358" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-84.75765262102833" cy="107.87337606312694" r="9.806670551193358" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="515.0238233971191" rx="295.8812600588625" ry="128.98329296030903" fill="none" stroke="url(#goldGradient)" stroke-width="19.613341102386716" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(458.35408672460653, 370.6664658167681)" opacity="0.3049957815421016">
      <ellipse rx="101.17443050818372" ry="4.202858807654296" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.202858807654296" ry="101.17443050818372" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="11.207623487078124" fill="#C7E84F" opacity="0.9" />
      <circle r="5.603811743539062" fill="#FFFFFF" />
      <circle r="26.97984813551566" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0042 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>