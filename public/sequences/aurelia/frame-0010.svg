<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="58.6%" cy="82.2%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 82.5%, 80.66025403784438%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 82.5%, 80.66025403784438%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 30°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="625.1409141384975" rx="221.06077691863462" ry="38.09948996135558" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="507.91171425740333" rx="245.62308546514956" ry="108.8556856038731" fill="none" stroke="url(#goldGradient)" stroke-width="35.7269942494763" />
    <ellipse cx="480" cy="507.91171425740333" rx="245.62308546514956" ry="108.8556856038731" fill="none" stroke="#FFFFFF" stroke-width="3.349405710888403" opacity="0.6598076211353316" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 435.3412571881546) rotate(7.50)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-73.68692563954487,-93.78335990487528 73.68692563954487,-93.78335990487528 92.10865704943109,0 73.68692563954487,93.78335990487528 -73.68692563954487,93.78335990487528 -92.10865704943109,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-55.265194229658654,-70.33751992865646 55.265194229658654,-70.33751992865646 63.86200222093889,0 55.265194229658654,70.33751992865646 -55.265194229658654,70.33751992865646 -63.86200222093889,0" fill="none" stroke="#FFFFFF" stroke-width="2.009643426533042" opacity="0.95" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-36.843462819772434,-46.89167995243764 36.843462819772434,-46.89167995243764 42.98403995640117,0 36.843462819772434,46.89167995243764 -36.843462819772434,46.89167995243764 -42.98403995640117,0" fill="#FFFFFF" opacity="0.5375000000000001" />
      
      <!-- Corner Step Cuts -->
      <line x1="-73.68692563954487" y1="-93.78335990487528" x2="-36.843462819772434" y2="-46.89167995243764" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="73.68692563954487" y1="-93.78335990487528" x2="36.843462819772434" y2="-46.89167995243764" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="73.68692563954487" y1="93.78335990487528" x2="36.843462819772434" y2="46.89167995243764" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-73.68692563954487" y1="93.78335990487528" x2="-36.843462819772434" y2="46.89167995243764" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-67.54634850291613" cy="-85.96807991280235" r="7.8152799920729406" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="67.54634850291613" cy="-85.96807991280235" r="7.8152799920729406" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="67.54634850291613" cy="85.96807991280235" r="7.8152799920729406" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-67.54634850291613" cy="85.96807991280235" r="7.8152799920729406" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="507.91171425740333" rx="235.79816204654355" ry="92.52733276329214" fill="none" stroke="url(#goldGradient)" stroke-width="15.630559984145881" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(507.9117142574034, 474.0168629642884)" opacity="0.5625000000000001">
      <ellipse rx="135.9375" ry="3.349405710888403" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.349405710888403" ry="135.9375" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.931748562369075" fill="#C7E84F" opacity="0.9" />
      <circle r="4.465874281184537" fill="#FFFFFF" />
      <circle r="36.25" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0010 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>