<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="65.1%" cy="20.3%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60.734152255572695%, 68.90983005625053%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60.734152255572695%, 68.90983005625053%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 252°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="657.3274941709344" rx="270.0834141988079" ry="22.301739179839064" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="514.1014411867181" rx="300.0926824431198" ry="63.71925479954019" fill="none" stroke="url(#goldGradient)" stroke-width="43.64984471899925" />
    <ellipse cx="480" cy="514.1014411867181" rx="300.0926824431198" ry="63.71925479954019" fill="none" stroke="#FFFFFF" stroke-width="4.0921729424061795" opacity="0.3072949016875158" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 425.43769410125094) rotate(-14.27)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-90.02780473293595,-114.58084238737302 90.02780473293595,-114.58084238737302 112.53475591616993,0 90.02780473293595,114.58084238737302 -90.02780473293595,114.58084238737302 -112.53475591616993,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-67.52085354970197,-85.93563179052977 67.52085354970197,-85.93563179052977 78.02409743521116,0 67.52085354970197,85.93563179052977 -67.52085354970197,85.93563179052977 -78.02409743521116,0" fill="none" stroke="#FFFFFF" stroke-width="2.4553037654437078" opacity="0.8469463130731181" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-45.013902366467974,-57.29042119368651 45.013902366467974,-57.29042119368651 52.51621942754597,0 45.013902366467974,57.29042119368651 -45.013902366467974,57.29042119368651 -52.51621942754597,0" fill="#FFFFFF" opacity="0.21642118334726856" />
      
      <!-- Corner Step Cuts -->
      <line x1="-90.02780473293595" y1="-114.58084238737302" x2="-45.013902366467974" y2="-57.29042119368651" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="90.02780473293595" y1="-114.58084238737302" x2="45.013902366467974" y2="-57.29042119368651" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="90.02780473293595" y1="114.58084238737302" x2="45.013902366467974" y2="57.29042119368651" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-90.02780473293595" y1="114.58084238737302" x2="-45.013902366467974" y2="57.29042119368651" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-82.52548767185796" cy="-105.03243885509195" r="9.548403532281085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="82.52548767185796" cy="-105.03243885509195" r="9.548403532281085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="82.52548767185796" cy="105.03243885509195" r="9.548403532281085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-82.52548767185796" cy="105.03243885509195" r="9.548403532281085" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="514.1014411867181" rx="288.088975145395" ry="54.16136657960916" fill="none" stroke="url(#goldGradient)" stroke-width="19.09680706456217" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(424.8227090945345, 457.50861283960626)" opacity="0.027368638912114253">
      <ellipse rx="63.69476625313543" ry="4.0921729424061795" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="4.0921729424061795" ry="63.69476625313543" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.912461179749812" fill="#C7E84F" opacity="0.9" />
      <circle r="5.456230589874906" fill="#FFFFFF" />
      <circle r="16.985271000836114" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0084 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>