<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="80.5%" cy="63.6%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 69.62448075682049%, 81.33580426497201%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 69.62448075682049%, 81.33580426497201%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 339°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="620.6607782412907" rx="214.23718532135035" ry="25.546153353298944" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="507.05014966178663" rx="238.0413170237226" ry="72.98900958085413" fill="none" stroke="url(#goldGradient)" stroke-width="34.624191567086925" />
    <ellipse cx="480" cy="507.05014966178663" rx="238.0413170237226" ry="72.98900958085413" fill="none" stroke="#FFFFFF" stroke-width="3.246017959414399" opacity="0.6800741279491604" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 436.71976054114134) rotate(-5.38)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-71.41239510711678,-90.88850286360318 71.41239510711678,-90.88850286360318 89.26549388389597,0 71.41239510711678,90.88850286360318 -71.41239510711678,90.88850286360318 -89.26549388389597,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-53.55929633033759,-68.16637714770239 53.55929633033759,-68.16637714770239 61.890742426167876,0 53.55929633033759,68.16637714770239 -53.55929633033759,68.16637714770239 -61.890742426167876,0" fill="none" stroke="#FFFFFF" stroke-width="1.9476107756486396" opacity="0.477248368952908" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-35.70619755355839,-45.44425143180159 35.70619755355839,-45.44425143180159 41.65723047915145,0 35.70619755355839,45.44425143180159 -35.70619755355839,45.44425143180159 -41.65723047915145,0" fill="#FFFFFF" opacity="0.2054711762656368" />
      
      <!-- Corner Step Cuts -->
      <line x1="-71.41239510711678" y1="-90.88850286360318" x2="-35.70619755355839" y2="-45.44425143180159" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="71.41239510711678" y1="-90.88850286360318" x2="35.70619755355839" y2="-45.44425143180159" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="71.41239510711678" y1="90.88850286360318" x2="35.70619755355839" y2="45.44425143180159" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-71.41239510711678" y1="90.88850286360318" x2="-35.70619755355839" y2="45.44425143180159" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-65.46136218152373" cy="-83.31446095830293" r="7.574041905300264" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="65.46136218152373" cy="-83.31446095830293" r="7.574041905300264" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="65.46136218152373" cy="83.31446095830293" r="7.574041905300264" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-65.46136218152373" cy="83.31446095830293" r="7.574041905300264" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="507.05014966178663" rx="228.5196643427737" ry="62.040658143726006" fill="none" stroke="url(#goldGradient)" stroke-width="15.148083810600529" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(520.2043574990917, 407.7596276686786)" opacity="0.00911862710939466">
      <ellipse rx="61.23101465976828" ry="3.246017959414399" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.246017959414399" ry="61.23101465976828" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="8.656047891771731" fill="#C7E84F" opacity="0.9" />
      <circle r="4.328023945885866" fill="#FFFFFF" />
      <circle r="16.32827057593821" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0113 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>