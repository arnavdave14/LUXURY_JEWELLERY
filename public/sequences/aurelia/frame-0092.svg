<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FCFAF5" stop-opacity="1" />
        <stop offset="60%" stop-color="#F5F1E8" stop-opacity="1" />
        <stop offset="100%" stop-color="#ECE5D8" stop-opacity="1" />
      </radialGradient>
      
      <radialGradient id="gemLight" cx="75.9%" cy="29.0%" r="65%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="25%" stop-color="#D8CBD8" stop-opacity="0.8" />
        <stop offset="55%" stop-color="#A85F72" stop-opacity="0.65" />
        <stop offset="85%" stop-color="#30202D" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#180C16" stop-opacity="0.98" />
      </radialGradient>

      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="hsl(43, 60.0821715694759%, 73.04528463267654%)" />
        <stop offset="35%" stop-color="#FFF4D0" />
        <stop offset="55%" stop-color="hsl(38, 65%, 52%)" />
        <stop offset="85%" stop-color="hsl(30, 60%, 32%)" />
        <stop offset="100%" stop-color="hsl(43, 60.0821715694759%, 73.04528463267654%)" />
      </linearGradient>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <filter id="sparkleBlur">
        <feGaussianBlur stdDeviation="3" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="960" fill="url(#bgGlow)" />
    
    <!-- Soft Vignette & Editorial Ambient Aura -->
    <circle cx="480" cy="480" r="380" fill="#E7D7C1" opacity="0.25" filter="url(#bloom)" />
    
    <!-- Fine Technical Measurement Rings -->
    <g opacity="0.35">
      <circle cx="480" cy="480" r="320" fill="none" stroke="#A85F72" stroke-width="0.75" stroke-dasharray="4 8" />
      <circle cx="480" cy="480" r="280" fill="none" stroke="#756B73" stroke-width="0.5" />
      <line x1="480" y1="120" x2="480" y2="150" stroke="#30202D" stroke-width="1" />
      <line x1="480" y1="810" x2="480" y2="840" stroke="#30202D" stroke-width="1" />
      <line x1="120" y1="480" x2="150" y2="480" stroke="#30202D" stroke-width="1" />
      <line x1="810" y1="480" x2="840" y2="480" stroke="#30202D" stroke-width="1" />
      <text x="495" y="145" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">ROT: 276°</text>
      <text x="495" y="835" font-family="monospace" font-size="10" fill="#756B73" letter-spacing="2">CARAT: 4.82ct VVS1</text>
    </g>

    <!-- Ring Shadow -->
    <ellipse cx="480" cy="649.1441404719932" rx="257.6195370265743" ry="20.579776395007066" fill="#30202D" opacity="0.12" filter="url(#bloom)" />

    <!-- 18K Gold Band (Behind Gem) -->
    <ellipse cx="480" cy="512.5277193215371" rx="286.24393002952695" ry="58.79936112859162" fill="none" stroke="url(#goldGradient)" stroke-width="41.635480731567554" />
    <ellipse cx="480" cy="512.5277193215371" rx="286.24393002952695" ry="58.79936112859162" fill="none" stroke="#FFFFFF" stroke-width="3.903326318584458" opacity="0.4313585389802962" />

    <!-- Gemstone Setting / Prongs -->
    <g transform="translate(480, 427.9556490855406) rotate(-14.92)">
      <!-- Emerald-Cut Emerald / Tourmaline / Diamond Solitaire Body -->
      <!-- Pavé under-gallery -->
      <polygon points="-85.87317900885809,-109.29313692036483 85.87317900885809,-109.29313692036483 107.3414737610726,0 85.87317900885809,109.29313692036483 -85.87317900885809,109.29313692036483 -107.3414737610726,0" fill="url(#gemLight)" stroke="#FFF4D0" stroke-width="1.5" filter="url(#bloom)" opacity="0.95" />
      
      <!-- Precision Emerald Cut Facets -->
      <polygon points="-64.40488425664357,-81.96985269027363 64.40488425664357,-81.96985269027363 74.42342180767702,0 64.40488425664357,81.96985269027363 -64.40488425664357,81.96985269027363 -74.42342180767702,0" fill="none" stroke="#FFFFFF" stroke-width="2.341995791150675" opacity="0.9377641290737883" />
      
      <!-- Table Facet (Center Mirror) -->
      <polygon points="-42.936589504429044,-54.646568460182415 42.936589504429044,-54.646568460182415 50.09268775516721,0 42.936589504429044,54.646568460182415 -42.936589504429044,54.646568460182415 -50.09268775516721,0" fill="#FFFFFF" opacity="0.690881372890606" />
      
      <!-- Corner Step Cuts -->
      <line x1="-85.87317900885809" y1="-109.29313692036483" x2="-42.936589504429044" y2="-54.646568460182415" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="85.87317900885809" y1="-109.29313692036483" x2="42.936589504429044" y2="-54.646568460182415" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="85.87317900885809" y1="109.29313692036483" x2="42.936589504429044" y2="54.646568460182415" stroke="#FFF" stroke-width="1.2" opacity="0.8" />
      <line x1="-85.87317900885809" y1="109.29313692036483" x2="-42.936589504429044" y2="54.646568460182415" stroke="#FFF" stroke-width="1.2" opacity="0.8" />

      <!-- Four Heavy 18K Gold Prongs -->
      <circle cx="-78.71708075811992" cy="-100.18537551033444" r="9.107761410030403" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="78.71708075811992" cy="-100.18537551033444" r="9.107761410030403" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="78.71708075811992" cy="100.18537551033444" r="9.107761410030403" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
      <circle cx="-78.71708075811992" cy="100.18537551033444" r="9.107761410030403" fill="url(#goldGradient)" stroke="#FFF" stroke-width="0.75" />
    </g>

    <!-- Front Ring Shank Highlight & Reflection -->
    <ellipse cx="480" cy="512.5277193215371" rx="274.79417282834584" ry="49.97945695930287" fill="none" stroke="url(#goldGradient)" stroke-width="18.215522820060805" opacity="0.9" />

    <!-- Optical Lens Flare & Caustic Sparkle on Peak Light -->
    <g transform="translate(416.3661787765916, 417.1350200894025)" opacity="0.8181356214843435">
      <ellipse rx="170.44830890038637" ry="3.903326318584458" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <ellipse rx="3.903326318584458" ry="170.44830890038637" fill="#FFFFFF" filter="url(#sparkleBlur)" />
      <circle r="10.408870182891889" fill="#C7E84F" opacity="0.9" />
      <circle r="5.204435091445944" fill="#FFFFFF" />
      <circle r="45.45288237343637" fill="#FFF" opacity="0.3" filter="url(#sparkleBlur)" />
    </g>

    <!-- Editorial Timecode & Lens Metadata Badge -->
    <g transform="translate(60, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#30202D" letter-spacing="3">FRAME // 0092 / 0120</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="2">AURELIA SOLITAIRE // RAW OPTICAL SCAN 8K</text>
    </g>
    <g transform="translate(820, 900)" opacity="0.6">
      <text font-family="monospace" font-size="11" fill="#C7E84F" font-weight="bold" letter-spacing="2">● 60 FPS</text>
      <text y="18" font-family="monospace" font-size="9" fill="#756B73" letter-spacing="1">REFRACTIVE INDEX: 2.417</text>
    </g>
  </svg>